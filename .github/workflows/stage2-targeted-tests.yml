name: stage2-targeted-tests

on:
  push:
    branches: [stage2-canonical-notebooks]
    paths:
      - 'requirements.txt'
      - 'notebooks/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/stage2-targeted-tests.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage2-canonical-notebooks
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tqdm nbformat nbclient jupyter-client ipykernel
      - name: Stage 2 targeted tests
        run: >-
          python -m unittest
          tests.test_stage2_workflow
          tests.test_stage2_notebooks
          tests.test_stage2_pricing_diagnostics
          -v
      - name: Full regression suite
        run: python -m unittest discover -s tests -v
