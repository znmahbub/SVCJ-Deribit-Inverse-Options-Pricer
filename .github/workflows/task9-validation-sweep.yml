name: task9-validation-sweep

on:
  push:
    branches: [paper-code-remediation]
    paths:
      - .github/workflows/task9-validation-sweep.yml

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat plotly
      - name: Compile Task 9 scripts
        run: |
          python -m py_compile scripts/run_task9_candidate.py scripts/finalize_task9_selection.py
      - name: Run regularization-selection tests
        run: python -m unittest tests.test_regularization_selection -v

  sweep:
    needs: preflight
    # One job is one lambda/currency chronological path. This removes Heston and
    # irrelevant full-snapshot repricing from the selection run while preserving
    # the exact SVCJ initialization, validation split, and warm-start semantics.
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 22
      matrix:
        lambda_ts: [0, 1, 3, 5, 10, 25, 50, 100, 250, 500, 1000]
        currency: [BTC, ETH]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run SVCJ validation candidate
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          python scripts/run_task9_candidate.py \
            --lambda-ts "${{ matrix.lambda_ts }}" \
            --currency "${{ matrix.currency }}" \
            --output "$RUNNER_TEMP/candidate/calibration_results_reg_${{ matrix.lambda_ts }}_${{ matrix.currency }}.xlsx"
      - name: Upload compact parameter workbook
        uses: actions/upload-artifact@v4
        with:
          name: task9-reg-${{ matrix.lambda_ts }}-${{ matrix.currency }}
          path: ${{ runner.temp }}/candidate/calibration_results_reg_${{ matrix.lambda_ts }}_${{ matrix.currency }}.xlsx
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  select:
    needs: sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat plotly
      - name: Download all candidate workbooks
        uses: actions/download-artifact@v4
        with:
          pattern: task9-reg-*
          path: candidate_workbooks
          merge-multiple: true
      - name: Assert validation-only candidate schema
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          files = sorted(Path('candidate_workbooks').glob('calibration_results_reg_*.xlsx'))
          assert len(files) == 22, f'Expected 22 candidate parts, found {len(files)}'
          forbidden = {'rmse_test', 'mae_test', 'test_data', 'price_svcj'}
          for path in files:
              frame = pd.read_excel(path, sheet_name='svcj_params', nrows=1)
              overlap = forbidden.intersection(frame.columns)
              assert not overlap, f'{path.name} leaks test/full-price columns: {sorted(overlap)}'
          print('Validation-only candidate schema verified for', len(files), 'artifacts')
          PY
      - name: Finalize validation-only selection
        run: |
          python scripts/finalize_task9_selection.py \
            --candidate-dir candidate_workbooks \
            --source-sha "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"
      - name: Verify locked gate and selection tests
        run: |
          python -m unittest tests.test_regularization_selection -v
          python - <<'PY'
          from pathlib import Path
          from notebooks._lib.chapter3_final import load_locked_regularisation
          path = Path('docs/reproducibility/regularization_selection.md')
          print('Locked lambda_TS =', load_locked_regularisation(path))
          PY
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Commit selection results and remove temporary sweep machinery
        run: |
          git rm scripts/run_task9_candidate.py scripts/finalize_task9_selection.py
          git rm .github/workflows/task9-validation-sweep.yml
          git add docs/reproducibility/regularization_selection.md \
                  docs/reproducibility/regularization_validation_summary.csv \
                  docs/reproducibility/regularization_candidate_manifest.csv
          git commit -m "results: lock validation-selected regularization"
          RESULTS_SHA="$(git rev-parse HEAD)"
          python - "$RESULTS_SHA" <<'PY'
          from pathlib import Path
          import sys
          path = Path('docs/reproducibility/regularization_selection.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('- Selection results commit: TBD', f'- Selection results commit: `{sys.argv[1]}`')
          path.write_text(text, encoding='utf-8')
          PY
          git add docs/reproducibility/regularization_selection.md
          git commit -m "docs: record regularization selection provenance"
      - name: Push locked selection
        run: git push origin HEAD:paper-code-remediation
