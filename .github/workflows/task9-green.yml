name: task9-green

on:
  push:
    branches: [paper-code-remediation]
    paths:
      - .github/workflows/task9-green.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbclient openpyxl plotly
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Apply Task 9 implementation
        run: python scripts/remediate_task9.py
      - name: Refresh notebook integrity baseline for intentional final-notebook redesign
        run: python tests/generate_notebook_reference_outputs.py
      - name: Verify Task 9 targeted
        run: |
          python -m unittest \
            tests.test_regularization_selection \
            tests.test_notebook_structure \
            tests.test_notebook_integrity \
            tests.test_notebook_regression_outputs -v
      - name: Verify prior data-independent regressions
        run: |
          python -m unittest \
            tests.test_analysis_window \
            tests.test_batch_regularization_sequence \
            tests.test_calibration_objective \
            tests.test_hedge_mapping \
            tests.test_hedging_invariants \
            tests.test_measure_delta_identities \
            tests.test_regression_reference_outputs \
            tests.test_results_store_io \
            tests.test_sanity_pricing \
            tests.test_snapshot_splitting \
            tests.test_svcj_admissibility -v
      - name: Remove temporary remediation machinery
        run: |
          git rm scripts/remediate_task9.py
          git rm .github/workflows/task9-red.yml .github/workflows/task9-green.yml
      - name: Commit Task 9
        run: |
          git add -A
          git commit -m "fix: select regularization on validation data only"
      - name: Ensure clean tree
        run: test -z "$(git status --porcelain)"
      - name: Push
        run: git push origin HEAD:paper-code-remediation
