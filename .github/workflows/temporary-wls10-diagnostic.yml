name: temporary-wls10-diagnostic

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare identical 10-snapshot window
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          keep = {
              'deribit_options_snapshot_20261024T080244Z.csv',
              'deribit_options_snapshot_20261024T131513Z.csv',
              'deribit_options_snapshot_20261024T180653Z.csv',
              'deribit_options_snapshot_20261024T230516Z.csv',
              'deribit_options_snapshot_20261025T081928Z.csv',
              'deribit_options_snapshot_20261025T134052Z.csv',
              'deribit_options_snapshot_20261025T182354Z.csv',
              'deribit_options_snapshot_20261025T230930Z.csv',
              'deribit_options_snapshot_20261026T084718Z.csv',
              'deribit_options_snapshot_20261026T152819Z.csv',
          }
          root = Path.cwd()
          data = root / 'data'
          existing = {p.name for p in data.glob('deribit_options_snapshot_*.csv')}
          missing = sorted(keep - existing)
          if missing:
              raise RuntimeError(f'missing selected snapshots: {missing}')
          for path in data.glob('deribit_options_snapshot_*.csv'):
              if path.name not in keep:
                  path.unlink()
          out = root / 'excel files' / 'canonical'
          if out.exists():
              shutil.rmtree(out)
          PY

      - name: Run WLS alone and emit exact diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          import pandas as pd

          root = Path.cwd()
          sys.path.insert(0, str(root / 'notebooks'))
          from _lib.stage2_workflow import build_calibration_configs
          from src.batch_runner import run_all_snapshots_to_excel

          cfg = build_calibration_configs(root, resume=False, verbose=True)['wls']
          run_all_snapshots_to_excel(cfg)

          rows = []
          path = cfg.output_xlsx
          for model in ('black', 'heston', 'svcj'):
              frame = pd.read_excel(path, sheet_name=f'{model}_params')
              success = frame['success'].fillna(False).astype(bool)
              print(f'{model}: success={int(success.sum())}/{len(frame)}')
              bad = frame.loc[~success].copy()
              if len(bad):
                  keep_cols = [c for c in (
                      'timestamp','currency','success','message','nfev','rmse_fit','rmse_train','rmse_test',
                      'kappa','theta','sigma_v','rho','v0','lam','ell_y','sigma_y','ell_v','rho_j',
                      'svcj_martingale_margin','svcj_martingale_violated','svcj_contour_margin','svcj_contour_violated'
                  ) if c in bad.columns]
                  print(f'FAILED {model}:')
                  print(bad[keep_cols].to_string(index=False))
                  bad.insert(0, 'model', model)
                  rows.append(bad)
          diag = pd.concat(rows, ignore_index=True, sort=False) if rows else pd.DataFrame(columns=['model'])
          diag.to_csv('wls10_failed_calibrations.csv', index=False)
          print(f'WLS_DIAGNOSTIC_FAILURE_ROWS={len(diag)}')
          PY

      - name: Upload WLS diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wls10-diagnostic
          path: |
            wls10_failed_calibrations.csv
            excel files/canonical/calibration_wls.xlsx
          if-no-files-found: warn
