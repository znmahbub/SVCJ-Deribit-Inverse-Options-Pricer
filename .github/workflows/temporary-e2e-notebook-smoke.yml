name: temporary-e2e-notebook-smoke

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
    paths:
      - .github/workflows/temporary-e2e-notebook-smoke.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel

      - name: Prepare two-snapshot smoke sample
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil

          root = Path.cwd()
          data_dir = root / 'data'
          files = sorted(data_dir.glob('deribit_options_snapshot_*.csv'))
          if len(files) < 2:
              raise RuntimeError(f'Need at least two option snapshots, found {len(files)}')

          selected = files[-2:]
          selected_names = {p.name for p in selected}
          for path in files:
              if path.name not in selected_names:
                  path.unlink()

          for path in [
              root / 'excel files' / 'canonical',
              root / 'notebooks' / 'pricing_outputs' / 'canonical',
              root / 'notebooks' / 'hedging_outputs' / 'canonical',
              root / 'notebooks' / 'final_outputs' / 'canonical',
          ]:
              if path.exists():
                  shutil.rmtree(path)

          payload = {'selected_snapshots': [p.name for p in selected]}
          Path('smoke_selected_snapshots.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Execute canonical notebooks 00 through 04
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for nb in \
            notebooks/00_check_data.ipynb \
            notebooks/01_run_calibration.ipynb \
            notebooks/02_pricing_analysis.ipynb \
            notebooks/03_run_hedging.ipynb \
            notebooks/04_final_analysis.ipynb
          do
            echo "========== EXECUTING ${nb} =========="
            jupyter nbconvert \
              --to notebook \
              --execute \
              --inplace \
              --ExecutePreprocessor.timeout=7200 \
              "${nb}"
          done

      - name: Verify code paths, outputs, and mathematical identities
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import math
          import re
          from pathlib import Path

          import nbformat
          import numpy as np
          import pandas as pd

          root = Path.cwd()
          selected = json.loads((root / 'smoke_selected_snapshots.json').read_text())['selected_snapshots']
          stamp_re = re.compile(r'deribit_options_snapshot_(\d{8}T\d{6})Z\.csv')
          selected_ts = [pd.to_datetime(stamp_re.fullmatch(name).group(1), format='%Y%m%dT%H%M%S', utc=True) for name in selected]
          expected_combos = {(ts, ccy) for ts in selected_ts for ccy in ('BTC', 'ETH')}

          report: dict[str, object] = {
              'selected_snapshots': selected,
              'checks': [],
              'calibration': {},
              'pricing': {},
              'hedging': {},
              'final_package': {},
              'progress_markers': {},
          }

          def check(condition: bool, message: str) -> None:
              if not condition:
                  raise AssertionError(message)
              report['checks'].append(message)

          def normalized_ts(series: pd.Series) -> pd.Series:
              return pd.to_datetime(series, utc=True, errors='coerce')

          def finite_rmse(values: np.ndarray) -> float:
              arr = np.asarray(values, dtype=float)
              arr = arr[np.isfinite(arr)]
              return float(np.sqrt(np.mean(arr * arr))) if len(arr) else float('nan')

          # Notebook execution + visible progress markers.
          marker_map = {
              '00_check_data.ipynb': ['Inspecting snapshots'],
              '01_run_calibration.ipynb': ['Calibration specifications'],
              '02_pricing_analysis.ipynb': ['Pricing specifications'],
              '03_run_hedging.ipynb': ['Hedging specifications', 'Hedging reports'],
              '04_final_analysis.ipynb': ['Copying pricing_table', 'Copying hedging_table'],
          }
          for name, markers in marker_map.items():
              nb = nbformat.read(root / 'notebooks' / name, as_version=4)
              errors = []
              rendered = []
              for cell in nb.cells:
                  for out in cell.get('outputs', []):
                      if out.get('output_type') == 'error':
                          errors.append(out.get('evalue', 'unknown notebook error'))
                      if 'text' in out:
                          text = out['text']
                          rendered.append(''.join(text) if isinstance(text, list) else str(text))
                      data = out.get('data', {})
                      for key in ('text/plain', 'text/html'):
                          if key in data:
                              value = data[key]
                              rendered.append(''.join(value) if isinstance(value, list) else str(value))
              check(not errors, f'{name} executed without notebook error outputs')
              blob = '\n'.join(rendered)
              found = {marker: (marker in blob) for marker in markers}
              report['progress_markers'][name] = found
              check(all(found.values()), f'{name} emitted its expected progress/status markers')

          # Calibration workbooks.
          required_sheets = {'black_params', 'heston_params', 'svcj_params', 'train_data', 'test_data'}
          test_key_sets: dict[str, set[tuple[str, str, str]]] = {}
          calibration_test_data: dict[str, pd.DataFrame] = {}
          for spec, lam in [('wls', 0.0), ('pwls', 1.0)]:
              path = root / 'excel files' / 'canonical' / f'calibration_{spec}.xlsx'
              check(path.exists(), f'{spec.upper()} calibration workbook exists')
              xl = pd.ExcelFile(path)
              check(set(xl.sheet_names) == required_sheets, f'{spec.upper()} calibration workbook has canonical five-sheet schema')

              spec_report = {'models': {}}
              for model in ('black', 'heston', 'svcj'):
                  params = pd.read_excel(path, sheet_name=f'{model}_params')
                  params['timestamp'] = normalized_ts(params['timestamp'])
                  params['currency'] = params['currency'].astype(str).str.upper()
                  combos = set(zip(params['timestamp'], params['currency']))
                  check(combos == expected_combos, f'{spec.upper()} {model} parameters cover both currencies at both smoke snapshots')
                  l2 = pd.to_numeric(params['l2_prev_strength'], errors='coerce').to_numpy(float)
                  check(np.allclose(l2, lam, atol=0.0, rtol=0.0, equal_nan=False), f'{spec.upper()} {model} uses lambda_TS={lam:g}')

                  success = params['success'].fillna(False).astype(bool)
                  model_report = {
                      'rows': int(len(params)),
                      'success': int(success.sum()),
                      'failed': int((~success).sum()),
                  }
                  if model == 'svcj' and success.any():
                      good = params.loc[success]
                      mart = good['svcj_martingale_violated'].fillna(False).astype(bool)
                      contour = good['svcj_contour_violated'].fillna(False).astype(bool)
                      check(not mart.any(), f'{spec.upper()} successful SVCJ rows satisfy martingale admissibility')
                      check(not contour.any(), f'{spec.upper()} successful SVCJ rows satisfy Carr-Madan contour admissibility')
                  spec_report['models'][model] = model_report

              train = pd.read_excel(path, sheet_name='train_data')
              test = pd.read_excel(path, sheet_name='test_data')
              calibration_test_data[spec] = test.copy()
              check(len(train) > 0 and len(test) > 0, f'{spec.upper()} train and test option sheets are non-empty')
              check(set(train['split'].astype(str).str.lower()) == {'train'}, f'{spec.upper()} train_data contains train split only')
              check(set(test['split'].astype(str).str.lower()) == {'test'}, f'{spec.upper()} test_data contains test split only')

              for frame in (train, test):
                  frame['snapshot_ts'] = normalized_ts(frame['snapshot_ts'])
                  frame['currency'] = frame['currency'].astype(str).str.upper()

              ratios = []
              for ts, ccy in sorted(expected_combos):
                  tr = train[(train['snapshot_ts'] == ts) & (train['currency'] == ccy)]
                  te = test[(test['snapshot_ts'] == ts) & (test['currency'] == ccy)]
                  check(len(tr) > 0 and len(te) > 0, f'{spec.upper()} {ccy} {ts.isoformat()} has both train and test observations')
                  overlap = set(tr['instrument_name'].astype(str)) & set(te['instrument_name'].astype(str))
                  check(not overlap, f'{spec.upper()} {ccy} {ts.isoformat()} train/test instruments do not overlap')
                  ratios.append(len(tr) / (len(tr) + len(te)))
              check(all(0.65 <= x <= 0.75 for x in ratios), f'{spec.upper()} option-level split is approximately 70/30 in every snapshot-currency block')

              key_cols = ['snapshot_ts', 'currency', 'instrument_name']
              test_keys = set(map(tuple, test[key_cols].astype(str).itertuples(index=False, name=None)))
              test_key_sets[spec] = test_keys
              spec_report['train_rows'] = int(len(train))
              spec_report['test_rows'] = int(len(test))
              spec_report['train_share_by_block'] = ratios
              report['calibration'][spec] = spec_report

          check(test_key_sets['wls'] == test_key_sets['pwls'], 'WLS and PWLS use the identical deterministic test holdout')

          # Pricing outputs and independent metric reconstruction.
          pricing_root = root / 'notebooks' / 'pricing_outputs' / 'canonical'
          expected_pricing_files = {
              'baseline_overall_metrics.csv',
              'snapshot_time_series_metrics.csv',
              'cross_sectional_bucket_metrics.csv',
              'svcj_parameter_summary.csv',
              'snapshot_model_win_rates.csv',
              'time_series_rmse_mae_panel.html',
              'time_series_within_spread_panel.html',
              'bucket_diagnostics_maturity.html',
              'bucket_diagnostics_moneyness.html',
              'svcj_parameter_paths_btc.html',
              'svcj_parameter_paths_eth.html',
          }
          for spec in ('wls', 'pwls'):
              run_dir = pricing_root / spec
              missing = sorted(name for name in expected_pricing_files if not (run_dir / name).exists())
              check(not missing, f'{spec.upper()} pricing analysis produced all expected CSV/HTML artifacts')

              overall = pd.read_csv(run_dir / 'baseline_overall_metrics.csv')
              check(set(overall['scope']) == {'BTC', 'ETH', 'Pooled'}, f'{spec.upper()} overall pricing table has BTC, ETH, and pooled scopes')
              pooled = overall.loc[overall['scope'] == 'Pooled'].iloc[0]
              for model in ('black', 'heston', 'svcj'):
                  check(pd.isna(pooled[f'rmse_coin_{model}']) and pd.isna(pooled[f'mae_coin_{model}']), f'{spec.upper()} pooled {model} raw-coin RMSE/MAE are intentionally undefined')

              test = calibration_test_data[spec].copy()
              F = pd.to_numeric(test['F0'] if 'F0' in test.columns else test['futures_price'], errors='coerce').to_numpy(float)
              mid = pd.to_numeric(test['mid_price_clean'], errors='coerce').to_numpy(float)
              for model in ('black', 'heston', 'svcj'):
                  price = pd.to_numeric(test[f'price_{model}'], errors='coerce').to_numpy(float)
                  err_coin = price - mid
                  direct_pooled_usd = finite_rmse(F * err_coin)
                  reported_pooled_usd = float(pooled[f'rmse_usd_{model}'])
                  if np.isfinite(direct_pooled_usd):
                      check(np.isclose(direct_pooled_usd, reported_pooled_usd, rtol=1e-10, atol=1e-12), f'{spec.upper()} pooled {model} USD-equivalent RMSE matches direct reconstruction')

                  for ccy in ('BTC', 'ETH'):
                      mask = test['currency'].astype(str).str.upper().to_numpy() == ccy
                      direct_coin = finite_rmse(err_coin[mask])
                      reported_coin = float(overall.loc[overall['scope'] == ccy, f'rmse_coin_{model}'].iloc[0])
                      if np.isfinite(direct_coin):
                          check(np.isclose(direct_coin, reported_coin, rtol=1e-10, atol=1e-12), f'{spec.upper()} {ccy} {model} coin RMSE matches direct reconstruction')

              report['pricing'][spec] = {
                  'overall_rows': int(len(overall)),
                  'snapshot_metric_rows': int(len(pd.read_csv(run_dir / 'snapshot_time_series_metrics.csv'))),
              }

          combined = pd.read_csv(pricing_root / 'overall_metrics_by_specification.csv')
          check(set(combined['specification']) == {'wls', 'pwls'}, 'pricing comparison table contains both WLS and PWLS')

          # Hedging outputs and mathematical identities.
          hedge_report_root = root / 'notebooks' / 'hedging_outputs' / 'canonical'
          expected_hedge_report_files = {
              'sample_construction.csv', 'headline_test.csv', 'by_timestamp_test.csv',
              'maturity_test.csv', 'maturity_ranges.csv', 'moneyness_test.csv',
              'moneyness_ranges.csv', 'basis_test.csv', 'basis_ranges.csv',
              'sensitivity_table.csv', 'pooled_rmse_reduction.html',
              'pooled_mae_reduction.html', 'snapshot_rmse_reduction.html',
              'ecdf_absolute_pnl.html', 'tail_comparison.html',
              'maturity_rmse_reduction.html', 'moneyness_rmse_reduction.html',
              'basis_rmse_reduction.html',
          }

          for spec in ('wls', 'pwls'):
              path = root / 'excel files' / 'canonical' / f'hedging_{spec}.xlsx'
              check(path.exists(), f'{spec.upper()} hedging workbook exists')
              xl = pd.ExcelFile(path)
              needed = {
                  'black_params', 'heston_params', 'svcj_params', 'train_data', 'test_data',
                  'hedge_interval_panel', 'hedge_summary_overall', 'hedge_summary_by_timestamp',
                  'hedge_summary_by_option', 'hedge_summary_by_maturity_bucket',
                  'hedge_summary_by_moneyness_bucket', 'price_verification', 'hedge_notes',
              }
              check(needed.issubset(set(xl.sheet_names)), f'{spec.upper()} hedging workbook has all canonical analysis sheets')

              test = pd.read_excel(path, sheet_name='test_data')
              price_ver = pd.read_excel(path, sheet_name='price_verification')
              panel = pd.read_excel(path, sheet_name='hedge_interval_panel')
              check(set(test['split'].astype(str).str.lower()) == {'test'}, f'{spec.upper()} hedging test_data remains test-only')
              check(set(panel['split'].astype(str).str.lower()) <= {'test'}, f'{spec.upper()} hedge interval panel contains test split only')
              check(len(panel) > 0, f'{spec.upper()} hedge interval panel is non-empty')

              for model in ('black', 'heston', 'svcj'):
                  pv = price_ver[price_ver['model'].astype(str).str.lower() == model]
                  check(len(pv) > 0, f'{spec.upper()} has price-verification diagnostics for {model}')
                  valid_diff = pd.to_numeric(pv['n_valid_diff'], errors='coerce').fillna(0) > 0
                  if valid_diff.any():
                      maxdiff = pd.to_numeric(pv.loc[valid_diff, 'max_abs_price_diff'], errors='coerce').max()
                      check(float(maxdiff) < 1e-8, f'{spec.upper()} hedging repricing reproduces persisted {model} prices to <1e-8 coin')

                  reg = pd.to_numeric(test[f'regular_delta_{model}'], errors='coerce').to_numpy(float)
                  net = pd.to_numeric(test[f'net_delta_{model}'], errors='coerce').to_numpy(float)
                  price = pd.to_numeric(test[f'price_{model}'], errors='coerce').to_numpy(float)
                  mask = np.isfinite(reg) & np.isfinite(net) & np.isfinite(price)
                  if mask.any():
                      check(np.allclose(net[mask], reg[mask] - price[mask], rtol=1e-8, atol=1e-9), f'{spec.upper()} {model} satisfies net_delta = regular_delta - V_coin')

              F = pd.to_numeric(panel['F_term'], errors='coerce').to_numpy(float)
              H0 = pd.to_numeric(panel['H_perp'], errors='coerce').to_numpy(float)
              H1 = pd.to_numeric(panel['perp_close_t1'], errors='coerce').to_numpy(float)
              scale = pd.to_numeric(panel['hedge_notional_scale_usd_per_delta'], errors='coerce').to_numpy(float)
              valid_scale = np.isfinite(F) & np.isfinite(H0) & (F > 0) & (H0 > 0) & np.isfinite(scale)
              check(valid_scale.any(), f'{spec.upper()} has hedgeable rows with finite F and perpetual prices')
              check(np.allclose(scale[valid_scale], H0[valid_scale] ** 2 / F[valid_scale], rtol=1e-12, atol=1e-12), f'{spec.upper()} hedge-notional scale equals H^2/F')

              key_cols = ['snapshot_ts', 'currency', 'instrument_name']
              test_join = test[key_cols + [f'regular_delta_{m}' for m in ('black','heston','svcj')] + [f'net_delta_{m}' for m in ('black','heston','svcj')]].copy()
              merged = panel.merge(test_join, on=key_cols, how='left', validate='many_to_one')
              for model in ('black', 'heston', 'svcj'):
                  for hedge_type, delta_col in [('delta', f'regular_delta_{model}'), ('net_delta', f'net_delta_{model}')]:
                      delta = pd.to_numeric(merged[delta_col], errors='coerce').to_numpy(float)
                      actual_N = pd.to_numeric(merged[f'hedge_notional_usd_{model}_{hedge_type}'], errors='coerce').to_numpy(float)
                      eligible = merged['is_summary_eligible'].fillna(False).astype(bool).to_numpy()
                      mask = eligible & np.isfinite(delta) & np.isfinite(actual_N) & np.isfinite(scale)
                      if mask.any():
                          check(np.allclose(actual_N[mask], scale[mask] * delta[mask], rtol=1e-10, atol=1e-10), f'{spec.upper()} {model} {hedge_type} notional satisfies N_USD=(H^2/F)*delta')
                          unhedged = pd.to_numeric(merged['option_pnl_coin_short'], errors='coerce').to_numpy(float)
                          actual_net = pd.to_numeric(merged[f'net_pnl_coin_{model}_{hedge_type}'], errors='coerce').to_numpy(float)
                          direct = unhedged + actual_N * (1.0 / H0 - 1.0 / H1)
                          pnl_mask = mask & np.isfinite(H1) & (H1 > 0) & np.isfinite(unhedged) & np.isfinite(actual_net)
                          check(np.allclose(actual_net[pnl_mask], direct[pnl_mask], rtol=1e-10, atol=1e-12), f'{spec.upper()} {model} {hedge_type} net hedge error matches inverse-perpetual P&L identity')

              run_dir = hedge_report_root / spec
              missing = sorted(name for name in expected_hedge_report_files if not (run_dir / name).exists())
              check(not missing, f'{spec.upper()} hedging reporting produced all expected CSV/HTML artifacts')
              headline = pd.read_csv(run_dir / 'headline_test.csv')
              check(set(headline['model'].astype(str).str.lower()) == {'black', 'heston', 'svcj'}, f'{spec.upper()} hedge headline compares all three models')
              check(set(headline['hedge_type'].astype(str).str.lower()) == {'delta', 'net_delta'}, f'{spec.upper()} hedge headline compares delta and net-delta rules')
              report['hedging'][spec] = {
                  'interval_rows': int(len(panel)),
                  'eligible_intervals': int(panel['is_summary_eligible'].fillna(False).astype(bool).sum()),
                  'headline_rows': int(len(headline)),
                  'headline': headline.to_dict(orient='records'),
              }

          # Final package.
          final_root = root / 'notebooks' / 'final_outputs' / 'canonical'
          manifest_path = final_root / 'manifest.csv'
          check(manifest_path.exists(), 'final manifest exists')
          manifest = pd.read_csv(manifest_path)
          check(len(manifest) > 0, 'final manifest is non-empty')
          check({'pricing_table', 'hedging_table', 'pricing_figure', 'hedging_figure'} <= set(manifest['artifact_type']), 'final manifest contains all four artifact classes')
          missing_destinations = [p for p in manifest['destination'].astype(str) if not Path(p).exists()]
          check(not missing_destinations, 'every manifest destination exists on disk')
          check((final_root / 'tables' / 'hedging' / 'wls').exists(), 'final package includes WLS hedging tables')
          check((final_root / 'tables' / 'hedging' / 'pwls').exists(), 'final package includes PWLS hedging tables')
          report['final_package'] = {
              'manifest_rows': int(len(manifest)),
              'artifact_counts': manifest['artifact_type'].value_counts().to_dict(),
          }

          (root / 'smoke_report.json').write_text(json.dumps(report, indent=2, default=str), encoding='utf-8')
          print('SMOKE_VERIFICATION_SUCCESS')
          print(json.dumps(report, indent=2, default=str))
          PY

      - name: Run full unit test suite after notebook smoke
        run: python -m unittest discover -s tests -v

      - name: Upload smoke report and representative outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-e2e-smoke
          path: |
            smoke_selected_snapshots.json
            smoke_report.json
            excel files/canonical/*.xlsx
            notebooks/pricing_outputs/canonical/**/*.csv
            notebooks/hedging_outputs/canonical/**/*.csv
            notebooks/final_outputs/canonical/manifest.csv
          if-no-files-found: warn
