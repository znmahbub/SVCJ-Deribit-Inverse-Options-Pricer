name: test-deribit-collector

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/collect_deribit_snapshot.py"
      - "tests/test_collect_deribit_snapshot.py"
      - "tests/test_deribit_depth_mapping.py"
      - ".github/workflows/test_deribit_collector.yml"
  push:
    branches:
      - "feature/richer-deribit-snapshots"

permissions:
  contents: read

jobs:
  collector-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: |
          python -m unittest tests.test_collect_deribit_snapshot.CollectorUnitTests tests.test_deribit_depth_mapping -v

      - name: Live Deribit smoke test
        env:
          DERIBIT_LIVE_TEST: "1"
        run: |
          python -m unittest tests.test_collect_deribit_snapshot.CollectorLiveTests -v
