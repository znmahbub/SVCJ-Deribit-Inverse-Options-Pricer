name: task13-stage2b-sweep-mid

on:
  push:
    branches: [task13-staged-rerun]
    paths:
      - .github/workflows/task13-stage2b-sweep-mid.yml

permissions:
  actions: read
  contents: read

jobs:
  calibrate:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        reg: [25, 50, 100]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      REG: ${{ matrix.reg }}
      UPSTREAM_RUN_ID: '38392782093'
      GH_TOKEN: ${{ github.token }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Wait for low-lambda gate
        shell: bash
        run: |
          while true; do
            status="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID} --jq .status)"
            conclusion="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID} --jq '.conclusion // ""')"
            echo "upstream status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "Low-lambda gate failed; refusing to run lambda=${REG}."
                exit 1
              fi
              break
            fi
            sleep 30
          done
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calibration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly threadpoolctl
      - name: Calibrate frozen sample and export validation-only selection evidence
        run: python scripts/task13_candidate.py
      - name: Upload compact candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-reg-${{ matrix.reg }}
          path: _task13/reg_${{ matrix.reg }}/candidate_export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
