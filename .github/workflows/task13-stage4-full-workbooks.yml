# Task 13 post-lock Stage 5: untouched-test pricing and SVCJ identification diagnostics
name: task13-stage5-test-identification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  test-and-identification:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task13-staged-rerun
      - name: Verify locked selection
        run: |
          grep -q '^- Status: LOCKED$' docs/reproducibility/regularization_selection.md
          grep -q '^- Selected lambda_TS: 1$' docs/reproducibility/regularization_selection.md
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install reporting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly nbconvert nbclient jupyter
      - name: Download corrected lambda 0 workbook
        uses: actions/download-artifact@v4
        with:
          name: task13-full-workbook-reg-0
          path: excel files/remediation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38540630247
      - name: Download corrected locked workbook
        uses: actions/download-artifact@v4
        with:
          name: task13-full-workbook-reg-1
          path: excel files/remediation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 38540630247
      - name: Verify corrected inputs
        run: |
          ls -lh 'excel files/remediation/'
          test -f 'excel files/remediation/calibration_results_reg_0.xlsx'
          test -f 'excel files/remediation/calibration_results_reg_1.xlsx'
      - name: Run untouched-test final pricing notebook
        run: |
          jupyter nbconvert --to notebook --execute notebooks/calibration_results_final.ipynb \
            --output calibration_results_final.executed.ipynb \
            --output-dir _task13/stage5 \
            --ExecutePreprocessor.timeout=3600
      - name: Run SVCJ identification diagnostics
        run: |
          mkdir -p _task13/stage5/identification
          python - <<'PY'
          import sys
          from pathlib import Path
          import pandas as pd
          sys.path.insert(0, str(Path('notebooks').resolve()))
          from _lib import chapter3_final, robustness

          root = Path('excel files/remediation')
          out = Path('_task13/stage5/identification')
          summaries = []
          for reg in (0, 1):
              path = root / f'calibration_results_reg_{reg}.xlsx'
              _, _, svcj, _ = chapter3_final.load_baseline_workbook(path, evaluation_split='test')
              ident = robustness.parameter_identification_summary(svcj)
              ident['lambda_TS'] = reg
              summaries.append(ident)
              for currency in ('BTC', 'ETH'):
                  robustness.parameter_correlation_matrix(svcj, currency=currency).to_csv(
                      out / f'svcj_parameter_correlations_reg_{reg}_{currency}.csv'
                  )
          identification = pd.concat(summaries, ignore_index=True)
          identification.to_csv(out / 'svcj_identification_summary.csv', index=False)
          print(identification.to_string(index=False))
          PY
      - name: Upload Stage 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task13-stage5-test-identification
          path: |
            _task13/stage5/
            notebooks/chapter3_outputs/remediation/final/
          if-no-files-found: warn
          retention-days: 30
