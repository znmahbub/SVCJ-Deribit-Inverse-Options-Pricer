name: Stage 4 verification

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply pending Stage 5 cleanup
        if: ${{ hashFiles('scripts/stage5_cleanup.py') != '' }}
        run: |
          python scripts/stage5_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: finalize canonical workflow cleanup"
          git push
      - name: Install requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run canonical FFT validation
        run: python -m unittest tests.test_fft_numerical_validation -v
      - name: Run miniature canonical pipeline
        run: python -m unittest tests.test_mini_pipeline -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
