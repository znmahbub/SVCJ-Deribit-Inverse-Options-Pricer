name: Stage 4 verification

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run canonical FFT validation
        run: python -m unittest tests.test_fft_numerical_validation -v
      - name: Run miniature canonical pipeline
        run: python -m unittest tests.test_mini_pipeline -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
