name: temporary-10snapshot-final

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel

      - name: Verify concurrency plan
        run: |
          python - <<'PY'
          import os
          import sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'notebooks'))
          import src.batch_runner as batch
          from _lib import stage2_workflow as stage2
          cfgs = stage2.build_calibration_configs(root, resume=False, verbose=False)
          cpus = os.cpu_count() or 1
          chains = batch._currency_process_count(cfgs['pwls'], available_cpus=cpus)
          concurrent = stage2._can_run_specifications_concurrently(cfgs, available_cpus=cpus)
          print({'cpu_count': cpus, 'wls_workers': cfgs['wls'].n_workers, 'pwls_currency_chains': chains, 'concurrent_specs': concurrent})
          assert chains == 2
          assert concurrent
          PY

      - name: Run complete unit suite
        run: |
          rm -rf .github/workflows
          python -m unittest discover -s tests -v

      - name: Prepare latest 10 consecutive snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import shutil
          root = Path.cwd()
          data = root / 'data'
          files = sorted(data.glob('deribit_options_snapshot_*.csv'))
          if len(files) < 10:
              raise RuntimeError(f'need at least 10 snapshots, got {len(files)}')
          chosen = files[-10:]
          keep = {p.name for p in chosen}
          for p in files:
              if p.name not in keep:
                  p.unlink()
          for p in (
              root / 'excel files' / 'canonical',
              root / 'notebooks' / 'pricing_outputs' / 'canonical',
              root / 'notebooks' / 'hedging_outputs' / 'canonical',
              root / 'notebooks' / 'final_outputs' / 'canonical',
          ):
              if p.exists():
                  shutil.rmtree(p)
          payload = {
              'n_snapshots': len(chosen),
              'first_snapshot': chosen[0].name,
              'last_snapshot': chosen[-1].name,
              'selected_snapshots': [p.name for p in chosen],
          }
          Path('acceptance_selection_10.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Execute notebooks 00 to 04 sequentially
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for nb in notebooks/00_check_data.ipynb notebooks/01_run_calibration.ipynb notebooks/02_pricing_analysis.ipynb notebooks/03_run_hedging.ipynb notebooks/04_final_analysis.ipynb
          do
            echo "========== EXECUTING ${nb} =========="
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=20000 "${nb}"
          done

      - name: Verify outputs and logic
        run: python .github/temporary_10snapshot_acceptance_final.py

      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage45-final-10snapshot-acceptance
          path: |
            acceptance_selection_10.json
            acceptance_report_10.json
            acceptance_warnings_10.csv
            acceptance_failed_svcj_wls.csv
            acceptance_failed_svcj_pwls.csv
            notebooks/pricing_outputs/canonical/overall_metrics_by_specification.csv
            notebooks/pricing_outputs/canonical/snapshot_win_rates_by_specification.csv
            notebooks/hedging_outputs/canonical/wls/headline_test.csv
            notebooks/hedging_outputs/canonical/pwls/headline_test.csv
            notebooks/hedging_outputs/canonical/wls/sample_construction.csv
            notebooks/hedging_outputs/canonical/pwls/sample_construction.csv
          if-no-files-found: warn

      - name: Remove temporary harness
        if: success()
        run: |
          rm -rf .github/workflows
          rm -f .github/temporary_10snapshot_acceptance_final.py
          rm -f .github/temporary_10snapshot_acceptance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u .github
          git diff --cached --check
          git commit -m "chore: remove temporary 10-snapshot verification harness"
          git push origin HEAD:stage4-5-final-validation-cleanup
