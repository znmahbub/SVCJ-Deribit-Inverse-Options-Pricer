name: temporary-e2e-notebook-smoke-v2

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
    paths:
      - .github/workflows/temporary-e2e-notebook-smoke-v2.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel

      - name: Prepare two-snapshot smoke sample
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path.cwd()
          data = root / 'data'
          files = sorted(data.glob('deribit_options_snapshot_*.csv'))
          if len(files) < 2:
              raise RuntimeError(f'Need >=2 snapshots, found {len(files)}')
          selected = files[-2:]
          keep = {p.name for p in selected}
          for p in files:
              if p.name not in keep:
                  p.unlink()
          for p in [
              root/'excel files'/'canonical',
              root/'notebooks'/'pricing_outputs'/'canonical',
              root/'notebooks'/'hedging_outputs'/'canonical',
              root/'notebooks'/'final_outputs'/'canonical',
          ]:
              if p.exists():
                  shutil.rmtree(p)
          payload={'selected_snapshots':[p.name for p in selected]}
          Path('smoke_selected_snapshots.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps(payload,indent=2))
          PY

      - name: Execute notebooks 00 through 04 sequentially
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for nb in \
            notebooks/00_check_data.ipynb \
            notebooks/01_run_calibration.ipynb \
            notebooks/02_pricing_analysis.ipynb \
            notebooks/03_run_hedging.ipynb \
            notebooks/04_final_analysis.ipynb
          do
            echo "========== ${nb} =========="
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=7200 "${nb}"
          done

      - name: Verify outputs and mathematical logic
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          import nbformat
          import numpy as np
          import pandas as pd

          root=Path.cwd()
          selected=json.loads((root/'smoke_selected_snapshots.json').read_text())['selected_snapshots']
          rx=re.compile(r'deribit_options_snapshot_(\d{8}T\d{6})Z\.csv')
          times=[pd.to_datetime(rx.fullmatch(x).group(1),format='%Y%m%dT%H%M%S',utc=True) for x in selected]
          expected={(ts,c) for ts in times for c in ('BTC','ETH')}
          report={'selected_snapshots':selected,'checks':[],'calibration':{},'pricing':{},'hedging':{},'final':{},'progress':{}}

          def ck(cond,msg):
              if not bool(cond): raise AssertionError(msg)
              report['checks'].append(msg)
          def nts(x): return pd.to_datetime(x,utc=True,errors='coerce')
          def arr(x): return pd.to_numeric(x,errors='coerce').to_numpy(float)
          def rmse(x):
              x=np.asarray(x,float); x=x[np.isfinite(x)]
              return float(np.sqrt(np.mean(x*x))) if len(x) else np.nan

          # Notebook execution and visible status/progress output.
          markers={
              '00_check_data.ipynb':['Inspecting snapshots'],
              '01_run_calibration.ipynb':['Calibration specifications'],
              '02_pricing_analysis.ipynb':['Pricing specifications'],
              '03_run_hedging.ipynb':['Hedging specifications','Hedging reports'],
              '04_final_analysis.ipynb':['Copying pricing_table','Copying hedging_table'],
          }
          for name,need in markers.items():
              nb=nbformat.read(root/'notebooks'/name,as_version=4)
              errors=[]; rendered=[]
              for cell in nb.cells:
                  for out in cell.get('outputs',[]):
                      if out.get('output_type')=='error': errors.append(out.get('evalue','error'))
                      if 'text' in out: rendered.append(str(out['text']))
                      for v in out.get('data',{}).values(): rendered.append(str(v))
              ck(not errors,f'{name}: executed without notebook errors')
              blob='\n'.join(rendered); found={m:(m in blob) for m in need}; report['progress'][name]=found
              ck(all(found.values()),f'{name}: expected progress/status markers emitted')

          # Calibration: fixed specs, deterministic split, admissibility.
          test_keys={}; test_frames={}
          for spec,lam in [('wls',0.0),('pwls',1.0)]:
              p=root/'excel files'/'canonical'/f'calibration_{spec}.xlsx'
              ck(p.exists(),f'{spec}: calibration workbook exists')
              ck(set(pd.ExcelFile(p).sheet_names)=={'black_params','heston_params','svcj_params','train_data','test_data'},f'{spec}: canonical five-sheet calibration schema')
              model_info={}
              for model in ('black','heston','svcj'):
                  d=pd.read_excel(p,sheet_name=f'{model}_params'); d['timestamp']=nts(d.timestamp); d['currency']=d.currency.astype(str).str.upper()
                  ck(set(zip(d.timestamp,d.currency))==expected,f'{spec} {model}: all 2x2 snapshot/currency blocks present')
                  ck(np.allclose(arr(d.l2_prev_strength),lam,rtol=0,atol=0),f'{spec} {model}: lambda_TS={lam:g}')
                  success=d.success.fillna(False).astype(bool)
                  ck(success.all(),f'{spec} {model}: all smoke calibrations converged')
                  if model=='svcj':
                      ck(not d.svcj_martingale_violated.fillna(False).astype(bool).any(),f'{spec} SVCJ: martingale admissibility holds')
                      ck(not d.svcj_contour_violated.fillna(False).astype(bool).any(),f'{spec} SVCJ: Carr-Madan contour admissibility holds')
                  model_info[model]={'rows':int(len(d)),'success':int(success.sum()),'rmse_test_mean':float(pd.to_numeric(d.rmse_test,errors='coerce').mean())}
              tr=pd.read_excel(p,sheet_name='train_data'); te=pd.read_excel(p,sheet_name='test_data'); test_frames[spec]=te.copy()
              for f in (tr,te): f['snapshot_ts']=nts(f.snapshot_ts); f['currency']=f.currency.astype(str).str.upper()
              ck(set(tr.split.astype(str).str.lower())=={'train'},f'{spec}: train_data is train-only')
              ck(set(te.split.astype(str).str.lower())=={'test'},f'{spec}: test_data is test-only')
              shares=[]
              for ts,c in sorted(expected):
                  a=tr[(tr.snapshot_ts==ts)&(tr.currency==c)]; b=te[(te.snapshot_ts==ts)&(te.currency==c)]
                  ck(len(a)>0 and len(b)>0,f'{spec} {c} {ts}: both train/test non-empty')
                  ck(not(set(a.instrument_name.astype(str))&set(b.instrument_name.astype(str))),f'{spec} {c} {ts}: no train/test instrument overlap')
                  shares.append(len(a)/(len(a)+len(b)))
              ck(all(.65<=x<=.75 for x in shares),f'{spec}: each block is approximately 70/30')
              test_keys[spec]=set(map(tuple,te[['snapshot_ts','currency','instrument_name']].astype(str).itertuples(index=False,name=None)))
              report['calibration'][spec]={'models':model_info,'train_rows':int(len(tr)),'test_rows':int(len(te)),'train_shares':shares}
          ck(test_keys['wls']==test_keys['pwls'],'WLS and PWLS use identical deterministic holdout rows')

          # Pricing: artifacts + independent reconstruction of headline RMSE logic.
          proot=root/'notebooks'/'pricing_outputs'/'canonical'
          for spec in ('wls','pwls'):
              d=proot/spec
              expected_files=['baseline_overall_metrics.csv','snapshot_time_series_metrics.csv','cross_sectional_bucket_metrics.csv','svcj_parameter_summary.csv','snapshot_model_win_rates.csv','time_series_rmse_mae_panel.html','time_series_within_spread_panel.html','bucket_diagnostics_maturity.html','bucket_diagnostics_moneyness.html','svcj_parameter_paths_btc.html','svcj_parameter_paths_eth.html']
              ck(all((d/f).exists() for f in expected_files),f'{spec}: complete pricing CSV/HTML artifact set exists')
              overall=pd.read_csv(d/'baseline_overall_metrics.csv'); pooled=overall[overall.scope=='Pooled'].iloc[0]
              ck(set(overall.scope)=={'BTC','ETH','Pooled'},f'{spec}: BTC/ETH/Pooled scopes present')
              te=test_frames[spec]; F=arr(te.F0 if 'F0' in te else te.futures_price); mid=arr(te.mid_price_clean)
              recon={}
              for model in ('black','heston','svcj'):
                  ck(pd.isna(pooled[f'rmse_coin_{model}']) and pd.isna(pooled[f'mae_coin_{model}']),f'{spec} {model}: pooled raw-coin errors are intentionally undefined')
                  price=arr(te[f'price_{model}']); err=price-mid
                  pooled_usd=rmse(F*err); reported=float(pooled[f'rmse_usd_{model}'])
                  ck(np.isclose(pooled_usd,reported,rtol=1e-10,atol=1e-12),f'{spec} {model}: pooled USD-equivalent RMSE reconstructs exactly')
                  recon[model]={'pooled_rmse_usd':reported}
                  for c in ('BTC','ETH'):
                      mask=te.currency.astype(str).str.upper().to_numpy()==c
                      direct=rmse(err[mask]); got=float(overall.loc[overall.scope==c,f'rmse_coin_{model}'].iloc[0])
                      ck(np.isclose(direct,got,rtol=1e-10,atol=1e-12),f'{spec} {c} {model}: coin RMSE reconstructs exactly')
              report['pricing'][spec]={'metrics':recon,'within_spread':{m:float(pooled[f'within_spread_{m}']) for m in ('black','heston','svcj')}}
          ck(set(pd.read_csv(proot/'overall_metrics_by_specification.csv').specification)=={'wls','pwls'},'pricing comparison includes both WLS and PWLS')

          # Hedging: both specs, finite eligible sample, model-price verification, hedge identities.
          hroot=root/'notebooks'/'hedging_outputs'/'canonical'
          for spec in ('wls','pwls'):
              p=root/'excel files'/'canonical'/f'hedging_{spec}.xlsx'; ck(p.exists(),f'{spec}: hedging workbook exists')
              sheets=set(pd.ExcelFile(p).sheet_names)
              need={'black_params','heston_params','svcj_params','train_data','test_data','hedge_interval_panel','hedge_summary_overall','hedge_summary_by_timestamp','hedge_summary_by_option','hedge_summary_by_maturity_bucke','hedge_summary_by_moneyness_buck','price_verification','hedge_notes'}
              ck(need<=sheets,f'{spec}: canonical hedging sheets present')
              te=pd.read_excel(p,sheet_name='test_data'); panel=pd.read_excel(p,sheet_name='hedge_interval_panel'); pv=pd.read_excel(p,sheet_name='price_verification')
              ck(set(te.split.astype(str).str.lower())=={'test'},f'{spec}: hedging option sheet remains test-only')
              ck(set(panel.split.astype(str).str.lower())<= {'test'},f'{spec}: interval panel remains test-only')
              eligible=panel.is_summary_eligible.fillna(False).astype(bool)
              ck(int(eligible.sum())>0,f'{spec}: hedge-eligible intervals exist after timestamp alignment')
              ck(np.isfinite(arr(panel.loc[eligible,'perp_close_t'])).all() and np.isfinite(arr(panel.loc[eligible,'perp_close_t1'])).all(),f'{spec}: eligible intervals have finite perpetual proxy prices at t and t+1')

              price_diag={}
              for model in ('black','heston','svcj'):
                  q=pv[pv.model.astype(str).str.lower()==model]
                  ck(len(q)==4,f'{spec} {model}: price verification covers all four snapshot/currency blocks')
                  ck(q.error.isna().all(),f'{spec} {model}: hedging repricing has no computation errors')
                  ck((pd.to_numeric(q.n_valid_prices)==pd.to_numeric(q.n_rows)).all(),f'{spec} {model}: all hedge-test options reprice finitely')
                  price_diag[model]={'max_abs_price_diff':float(pd.to_numeric(q.max_abs_price_diff).max()),'max_block_rmse_diff':float(pd.to_numeric(q.rmse_price_diff).max())}

              F=arr(panel.F_term); H0=arr(panel.H_perp); H1=arr(panel.perp_close_t1); scale=arr(panel.hedge_notional_scale_usd_per_delta)
              m=np.isfinite(F)&np.isfinite(H0)&np.isfinite(scale)&(F>0)&(H0>0)
              ck(np.allclose(scale[m],H0[m]**2/F[m],rtol=1e-12,atol=1e-12),f'{spec}: stored hedge scale equals H^2/F')

              keys=['snapshot_ts','currency','instrument_name']
              delta_cols=[f'{h}_delta_{model}' for model in ('black','heston','svcj') for h in ('regular','net')]
              joined=panel.merge(te[keys+delta_cols],on=keys,how='left',validate='many_to_one')
              elig=joined.is_summary_eligible.fillna(False).astype(bool).to_numpy()
              for model in ('black','heston','svcj'):
                  for h,dc in [('delta',f'regular_delta_{model}'),('net_delta',f'net_delta_{model}')]:
                      delta=arr(joined[dc]); N=arr(joined[f'hedge_notional_usd_{model}_{h}']); mm=elig&np.isfinite(delta)&np.isfinite(N)&np.isfinite(scale)
                      ck(mm.any(),f'{spec} {model} {h}: finite eligible hedge rows exist')
                      ck(np.allclose(N[mm],scale[mm]*delta[mm],rtol=1e-10,atol=1e-10),f'{spec} {model} {h}: N_USD=(H^2/F)*delta')
                      un=arr(joined.option_pnl_coin_short); net=arr(joined[f'net_pnl_coin_{model}_{h}']); direct=un+N*(1/H0-1/H1); pm=mm&np.isfinite(H1)&(H1>0)&np.isfinite(un)&np.isfinite(net)
                      ck(np.allclose(net[pm],direct[pm],rtol=1e-10,atol=1e-12),f'{spec} {model} {h}: inverse-perpetual hedge-error identity holds')

              rd=hroot/spec
              report_files=['sample_construction.csv','headline_test.csv','by_timestamp_test.csv','maturity_test.csv','maturity_ranges.csv','moneyness_test.csv','moneyness_ranges.csv','basis_test.csv','basis_ranges.csv','sensitivity_table.csv','pooled_rmse_reduction.html','pooled_mae_reduction.html','snapshot_rmse_reduction.html','ecdf_absolute_pnl.html','tail_comparison.html','maturity_rmse_reduction.html','moneyness_rmse_reduction.html','basis_rmse_reduction.html']
              ck(all((rd/f).exists() for f in report_files),f'{spec}: complete hedging CSV/HTML artifact set exists')
              head=pd.read_csv(rd/'headline_test.csv')
              ck(len(head)>0,f'{spec}: headline hedge table is non-empty')
              ck(set(head.model.astype(str).str.lower())=={'black','heston','svcj'},f'{spec}: headline covers Black/Heston/SVCJ')
              ck(set(head.hedge_type.astype(str).str.lower())=={'delta','net_delta'},f'{spec}: headline covers delta/net-delta')
              report['hedging'][spec]={'panel_rows':int(len(panel)),'eligible_intervals':int(eligible.sum()),'price_verification':price_diag,'headline':head.to_dict(orient='records')}

          # Final package includes both pricing and both hedging specs.
          final=root/'notebooks'/'final_outputs'/'canonical'; manifest=pd.read_csv(final/'manifest.csv')
          ck(len(manifest)>0,'final manifest is non-empty')
          ck({'pricing_table','hedging_table','pricing_figure','hedging_figure'}<=set(manifest.artifact_type),'final package has all four artifact classes')
          ck(all(Path(p).exists() for p in manifest.destination.astype(str)),'every manifest destination exists')
          ck(manifest.destination.astype(str).str.contains('/hedging/wls/').any(),'final package includes WLS hedging artifacts')
          ck(manifest.destination.astype(str).str.contains('/hedging/pwls/').any(),'final package includes PWLS hedging artifacts')
          report['final']={'manifest_rows':int(len(manifest)),'counts':manifest.artifact_type.value_counts().to_dict()}

          (root/'smoke_report.json').write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
          print('SMOKE_VERIFICATION_SUCCESS')
          print(json.dumps(report,indent=2,default=str))
          PY

      - name: Run focused mathematical and workflow tests
        run: |
          python -m unittest -v \
            tests.test_perp_price_provenance.PerpetualPriceProvenanceTests.test_perp_timestamps_are_normalized_to_snapshot_second_precision \
            tests.test_hedge_mapping \
            tests.test_hedging_invariants \
            tests.test_measure_delta_identities \
            tests.test_chapter3_metrics \
            tests.test_svcj_admissibility \
            tests.test_snapshot_splitting \
            tests.test_stage2_notebooks \
            tests.test_stage2_workflow \
            tests.test_stage3_notebooks \
            tests.test_stage3_workflow \
            tests.test_canonical_notebooks \
            tests.test_notebook_progress

      - name: Upload smoke report and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-e2e-smoke-final
          path: |
            smoke_selected_snapshots.json
            smoke_report.json
            excel files/canonical/*.xlsx
            notebooks/pricing_outputs/canonical/
            notebooks/hedging_outputs/canonical/
            notebooks/final_outputs/canonical/
            notebooks/00_check_data.ipynb
            notebooks/01_run_calibration.ipynb
            notebooks/02_pricing_analysis.ipynb
            notebooks/03_run_hedging.ipynb
            notebooks/04_final_analysis.ipynb
          if-no-files-found: warn
