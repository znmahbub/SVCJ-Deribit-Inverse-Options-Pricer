name: temporary-e2e-notebook-smoke-v2

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
    paths:
      - .github/workflows/temporary-e2e-notebook-smoke-v2.yml

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel

      - name: Prepare two-snapshot hedge-covered smoke sample
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, shutil
          import numpy as np
          import pandas as pd

          root = Path.cwd()
          data_dir = root / 'data'
          option_files = sorted(data_dir.glob('deribit_options_snapshot_*.csv'))
          if len(option_files) < 2:
              raise RuntimeError('Need at least two option snapshots')

          perp_path = data_dir / 'perpetual_futures_prices.csv'
          perp = pd.read_csv(perp_path)
          if 'obs_datetime' not in perp.columns or 'coin' not in perp.columns:
              raise RuntimeError('perpetual_futures_prices.csv lacks obs_datetime/coin')
          price_col = 'perp_futures_price_proxy' if 'perp_futures_price_proxy' in perp.columns else 'perp_futures_mark_price'
          perp['_ts'] = pd.to_datetime(perp['obs_datetime'], utc=True, errors='coerce')
          perp['_ccy'] = perp['coin'].astype(str).str.upper()
          perp['_price'] = pd.to_numeric(perp[price_col], errors='coerce')
          good = perp[np.isfinite(perp['_price']) & perp['_ts'].notna()]
          covered = set()
          for ts, g in good.groupby('_ts'):
              if {'BTC','ETH'} <= set(g['_ccy']):
                  covered.add(ts)

          rx = re.compile(r'deribit_options_snapshot_(\d{8}T\d{6})Z\.csv')
          eligible = []
          for p in option_files:
              m = rx.fullmatch(p.name)
              ts = pd.to_datetime(m.group(1), format='%Y%m%dT%H%M%S', utc=True)
              if ts in covered:
                  eligible.append((ts, p))
          if len(eligible) < 2:
              raise RuntimeError(f'Only {len(eligible)} option snapshots have exact BTC+ETH perpetual coverage')

          chosen = None
          overlap_info = None
          for (ts0, p0), (ts1, p1) in zip(reversed(eligible[:-1]), reversed(eligible[1:])):
              a = pd.read_csv(p0, usecols=['currency','instrument_name'])
              b = pd.read_csv(p1, usecols=['currency','instrument_name'])
              counts = {}
              for ccy in ('BTC','ETH'):
                  sa = set(a.loc[a['currency'].astype(str).str.upper()==ccy, 'instrument_name'].astype(str))
                  sb = set(b.loc[b['currency'].astype(str).str.upper()==ccy, 'instrument_name'].astype(str))
                  counts[ccy] = len(sa & sb)
              if min(counts.values()) >= 50:
                  chosen = [(ts0,p0),(ts1,p1)]
                  overlap_info = counts
                  break
          if chosen is None:
              chosen = eligible[-2:]
              overlap_info = {'BTC': None, 'ETH': None}

          selected = [p for _,p in chosen]
          selected_names = {p.name for p in selected}
          for p in option_files:
              if p.name not in selected_names:
                  p.unlink()

          for p in [
              root / 'excel files' / 'canonical',
              root / 'notebooks' / 'pricing_outputs' / 'canonical',
              root / 'notebooks' / 'hedging_outputs' / 'canonical',
              root / 'notebooks' / 'final_outputs' / 'canonical',
          ]:
              if p.exists():
                  shutil.rmtree(p)

          payload = {
              'selected_snapshots': [p.name for p in selected],
              'perpetual_price_column': price_col,
              'raw_instrument_overlap': overlap_info,
          }
          Path('smoke_selected_snapshots.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY

      - name: Execute canonical notebooks 00 through 04
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for nb in \
            notebooks/00_check_data.ipynb \
            notebooks/01_run_calibration.ipynb \
            notebooks/02_pricing_analysis.ipynb \
            notebooks/03_run_hedging.ipynb \
            notebooks/04_final_analysis.ipynb
          do
            echo "========== EXECUTING ${nb} =========="
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=7200 "${nb}"
          done

      - name: Verify outputs and mathematical identities
        run: |
          python - <<'PY'
          from __future__ import annotations
          import json, re
          from pathlib import Path
          import nbformat
          import numpy as np
          import pandas as pd

          root = Path.cwd()
          selection = json.loads((root/'smoke_selected_snapshots.json').read_text())
          selected = selection['selected_snapshots']
          rx = re.compile(r'deribit_options_snapshot_(\d{8}T\d{6})Z\.csv')
          ts_list = [pd.to_datetime(rx.fullmatch(x).group(1), format='%Y%m%dT%H%M%S', utc=True) for x in selected]
          expected = {(ts,c) for ts in ts_list for c in ('BTC','ETH')}
          report = {'selection':selection,'checks':[],'calibration':{},'pricing':{},'hedging':{},'progress':{},'final':{}}
          def ck(x,msg):
              if not x: raise AssertionError(msg)
              report['checks'].append(msg)
          def nts(s): return pd.to_datetime(s,utc=True,errors='coerce')
          def rmse(x):
              x=np.asarray(x,float); x=x[np.isfinite(x)]
              return float(np.sqrt(np.mean(x*x))) if len(x) else np.nan

          markers={
            '00_check_data.ipynb':['Inspecting snapshots'],
            '01_run_calibration.ipynb':['Calibration specifications'],
            '02_pricing_analysis.ipynb':['Pricing specifications'],
            '03_run_hedging.ipynb':['Hedging specifications','Hedging reports'],
            '04_final_analysis.ipynb':['Copying pricing_table','Copying hedging_table'],
          }
          for name, need in markers.items():
              nb=nbformat.read(root/'notebooks'/name,as_version=4); text=[]; errors=[]
              for cell in nb.cells:
                  for out in cell.get('outputs',[]):
                      if out.get('output_type')=='error': errors.append(out.get('evalue'))
                      if 'text' in out: text.append(str(out['text']))
                      for val in out.get('data',{}).values(): text.append(str(val))
              blob='\n'.join(text)
              ck(not errors,f'{name}: no notebook error outputs')
              found={m:m in blob for m in need}; report['progress'][name]=found
              ck(all(found.values()),f'{name}: expected progress/status markers emitted')

          tests={}
          caldata={}
          for spec,lam in [('wls',0.0),('pwls',1.0)]:
              p=root/'excel files'/'canonical'/f'calibration_{spec}.xlsx'; ck(p.exists(),f'{spec}: calibration workbook exists')
              ck(set(pd.ExcelFile(p).sheet_names)=={'black_params','heston_params','svcj_params','train_data','test_data'},f'{spec}: canonical calibration schema')
              sr={'models':{}}
              for model in ('black','heston','svcj'):
                  d=pd.read_excel(p,sheet_name=f'{model}_params'); d['timestamp']=nts(d['timestamp']); d['currency']=d['currency'].astype(str).str.upper()
                  ck(set(zip(d['timestamp'],d['currency']))==expected,f'{spec} {model}: all snapshot/currency blocks present')
                  ck(np.allclose(pd.to_numeric(d['l2_prev_strength']).to_numpy(float),lam,rtol=0,atol=0),f'{spec} {model}: lambda_TS={lam:g}')
                  success=d['success'].fillna(False).astype(bool)
                  ck(success.all(),f'{spec} {model}: all smoke calibrations converged')
                  if model=='svcj':
                      ck(not d['svcj_martingale_violated'].fillna(False).astype(bool).any(),f'{spec} SVCJ: martingale admissibility holds')
                      ck(not d['svcj_contour_violated'].fillna(False).astype(bool).any(),f'{spec} SVCJ: Carr-Madan contour admissibility holds')
                  sr['models'][model]={'success':int(success.sum()),'rows':len(d)}
              tr=pd.read_excel(p,sheet_name='train_data'); te=pd.read_excel(p,sheet_name='test_data'); caldata[spec]=te.copy()
              for f in (tr,te): f['snapshot_ts']=nts(f['snapshot_ts']); f['currency']=f['currency'].astype(str).str.upper()
              ck(set(tr['split'].astype(str).str.lower())=={'train'},f'{spec}: train sheet is train-only')
              ck(set(te['split'].astype(str).str.lower())=={'test'},f'{spec}: test sheet is test-only')
              ratios=[]
              for ts,c in sorted(expected):
                  a=tr[(tr.snapshot_ts==ts)&(tr.currency==c)]; b=te[(te.snapshot_ts==ts)&(te.currency==c)]
                  ck(len(a)>0 and len(b)>0,f'{spec} {c} {ts}: both splits non-empty')
                  ck(not(set(a.instrument_name.astype(str))&set(b.instrument_name.astype(str))),f'{spec} {c} {ts}: no train/test overlap')
                  ratios.append(len(a)/(len(a)+len(b)))
              ck(all(.65<=x<=.75 for x in ratios),f'{spec}: each block is approximately 70/30')
              keys=set(map(tuple,te[['snapshot_ts','currency','instrument_name']].astype(str).itertuples(index=False,name=None))); tests[spec]=keys
              sr.update(train_rows=len(tr),test_rows=len(te),train_shares=ratios); report['calibration'][spec]=sr
          ck(tests['wls']==tests['pwls'],'WLS/PWLS use identical deterministic test holdout')

          proot=root/'notebooks'/'pricing_outputs'/'canonical'
          for spec in ('wls','pwls'):
              d=proot/spec
              for fn in ['baseline_overall_metrics.csv','snapshot_time_series_metrics.csv','cross_sectional_bucket_metrics.csv','svcj_parameter_summary.csv','snapshot_model_win_rates.csv','time_series_rmse_mae_panel.html','time_series_within_spread_panel.html','bucket_diagnostics_maturity.html','bucket_diagnostics_moneyness.html','svcj_parameter_paths_btc.html','svcj_parameter_paths_eth.html']:
                  ck((d/fn).exists(),f'{spec}: pricing artifact {fn} exists')
              overall=pd.read_csv(d/'baseline_overall_metrics.csv'); pooled=overall[overall.scope=='Pooled'].iloc[0]; te=caldata[spec]
              ck(set(overall.scope)=={'BTC','ETH','Pooled'},f'{spec}: pricing scopes correct')
              F=pd.to_numeric(te['F0'] if 'F0' in te else te['futures_price'],errors='coerce').to_numpy(float); mid=pd.to_numeric(te.mid_price_clean,errors='coerce').to_numpy(float)
              for model in ('black','heston','svcj'):
                  ck(pd.isna(pooled[f'rmse_coin_{model}']) and pd.isna(pooled[f'mae_coin_{model}']),f'{spec} {model}: pooled raw-coin metrics intentionally undefined')
                  price=pd.to_numeric(te[f'price_{model}'],errors='coerce').to_numpy(float); err=price-mid
                  ck(np.isclose(rmse(F*err),float(pooled[f'rmse_usd_{model}']),rtol=1e-10,atol=1e-12),f'{spec} {model}: pooled USD RMSE reconstructs exactly')
                  for c in ('BTC','ETH'):
                      mask=te.currency.astype(str).str.upper().to_numpy()==c; got=float(overall.loc[overall.scope==c,f'rmse_coin_{model}'].iloc[0])
                      ck(np.isclose(rmse(err[mask]),got,rtol=1e-10,atol=1e-12),f'{spec} {c} {model}: coin RMSE reconstructs exactly')
              report['pricing'][spec]={'overall':overall.to_dict(orient='records')}
          ck(set(pd.read_csv(proot/'overall_metrics_by_specification.csv').specification)=={'wls','pwls'},'pricing comparison contains WLS and PWLS')

          hroot=root/'notebooks'/'hedging_outputs'/'canonical'
          for spec in ('wls','pwls'):
              p=root/'excel files'/'canonical'/f'hedging_{spec}.xlsx'; ck(p.exists(),f'{spec}: hedging workbook exists')
              sheets=set(pd.ExcelFile(p).sheet_names)
              need={'black_params','heston_params','svcj_params','train_data','test_data','hedge_interval_panel','hedge_summary_overall','hedge_summary_by_timestamp','hedge_summary_by_option','hedge_summary_by_maturity_bucke','hedge_summary_by_moneyness_buck','price_verification','hedge_notes'}
              ck(need<=sheets,f'{spec}: hedging workbook canonical sheet set present (including Excel-truncated bucket sheet names)')
              te=pd.read_excel(p,sheet_name='test_data'); pv=pd.read_excel(p,sheet_name='price_verification'); panel=pd.read_excel(p,sheet_name='hedge_interval_panel')
              ck(set(te['split'].astype(str).str.lower())=={'test'},f'{spec}: hedging test sheet is test-only')
              ck(set(panel['split'].astype(str).str.lower())<= {'test'},f'{spec}: interval panel is test-only')
              ck(panel['is_summary_eligible'].fillna(False).astype(bool).sum()>0,f'{spec}: smoke sample has hedge-eligible intervals')
              price_diag={}
              for model in ('black','heston','svcj'):
                  q=pv[pv.model.astype(str).str.lower()==model]; ck(len(q)>0,f'{spec} {model}: price verification rows exist')
                  ck(q['error'].isna().all(),f'{spec} {model}: no hedging repricing errors')
                  ck((pd.to_numeric(q.n_valid_prices)==pd.to_numeric(q.n_rows)).all(),f'{spec} {model}: all hedge test options reprice finitely')
                  price_diag[model]={'max_abs_price_diff':float(pd.to_numeric(q.max_abs_price_diff).max()),'mean_abs_price_diff_max_block':float(pd.to_numeric(q.mean_abs_price_diff).max())}
                  reg=pd.to_numeric(te[f'regular_delta_{model}'],errors='coerce').to_numpy(float); net=pd.to_numeric(te[f'net_delta_{model}'],errors='coerce').to_numpy(float); persisted=pd.to_numeric(te[f'price_{model}'],errors='coerce').to_numpy(float)
                  m=np.isfinite(reg)&np.isfinite(net)&np.isfinite(persisted); mismatch=np.abs((reg-net)-persisted)
                  price_diag[model]['max_net_delta_price_mismatch']=float(np.nanmax(mismatch[m])) if m.any() else np.nan
              F=pd.to_numeric(panel.F_term,errors='coerce').to_numpy(float); H0=pd.to_numeric(panel.H_perp,errors='coerce').to_numpy(float); H1=pd.to_numeric(panel.perp_close_t1,errors='coerce').to_numpy(float); scale=pd.to_numeric(panel.hedge_notional_scale_usd_per_delta,errors='coerce').to_numpy(float)
              m=np.isfinite(F)&np.isfinite(H0)&np.isfinite(scale)&(F>0)&(H0>0); ck(m.any(),f'{spec}: finite hedge mapping inputs exist'); ck(np.allclose(scale[m],H0[m]**2/F[m],rtol=1e-12,atol=1e-12),f'{spec}: H^2/F hedge scale identity holds')
              key=['snapshot_ts','currency','instrument_name']; join=te[key+[f'regular_delta_{x}' for x in ('black','heston','svcj')]+[f'net_delta_{x}' for x in ('black','heston','svcj')]]; merged=panel.merge(join,on=key,how='left',validate='many_to_one'); eligible=merged.is_summary_eligible.fillna(False).astype(bool).to_numpy()
              for model in ('black','heston','svcj'):
                  for ht,dc in [('delta',f'regular_delta_{model}'),('net_delta',f'net_delta_{model}')]:
                      delta=pd.to_numeric(merged[dc],errors='coerce').to_numpy(float); N=pd.to_numeric(merged[f'hedge_notional_usd_{model}_{ht}'],errors='coerce').to_numpy(float); mm=eligible&np.isfinite(delta)&np.isfinite(N)&np.isfinite(scale)
                      ck(mm.any(),f'{spec} {model} {ht}: eligible finite hedge rows exist')
                      ck(np.allclose(N[mm],scale[mm]*delta[mm],rtol=1e-10,atol=1e-10),f'{spec} {model} {ht}: N_USD=(H^2/F)*delta')
                      un=pd.to_numeric(merged.option_pnl_coin_short,errors='coerce').to_numpy(float); actual=pd.to_numeric(merged[f'net_pnl_coin_{model}_{ht}'],errors='coerce').to_numpy(float); direct=un+N*(1/H0-1/H1); pm=mm&np.isfinite(H1)&(H1>0)&np.isfinite(un)&np.isfinite(actual)
                      ck(np.allclose(actual[pm],direct[pm],rtol=1e-10,atol=1e-12),f'{spec} {model} {ht}: inverse-perpetual hedge P&L identity holds')
              rd=hroot/spec
              for fn in ['sample_construction.csv','headline_test.csv','by_timestamp_test.csv','maturity_test.csv','maturity_ranges.csv','moneyness_test.csv','moneyness_ranges.csv','basis_test.csv','basis_ranges.csv','sensitivity_table.csv','pooled_rmse_reduction.html','pooled_mae_reduction.html','snapshot_rmse_reduction.html','ecdf_absolute_pnl.html','tail_comparison.html','maturity_rmse_reduction.html','moneyness_rmse_reduction.html','basis_rmse_reduction.html']:
                  ck((rd/fn).exists(),f'{spec}: hedging artifact {fn} exists')
              head=pd.read_csv(rd/'headline_test.csv'); ck(len(head)>0,f'{spec}: hedge headline is non-empty'); ck(set(head.model.astype(str).str.lower())=={'black','heston','svcj'},f'{spec}: headline covers all models'); ck(set(head.hedge_type.astype(str).str.lower())=={'delta','net_delta'},f'{spec}: headline covers both hedge rules')
              report['hedging'][spec]={'panel_rows':len(panel),'eligible':int(panel.is_summary_eligible.fillna(False).astype(bool).sum()),'price_verification':price_diag,'headline':head.to_dict(orient='records')}

          final=root/'notebooks'/'final_outputs'/'canonical'; manifest=pd.read_csv(final/'manifest.csv'); ck(len(manifest)>0,'final manifest non-empty'); ck({'pricing_table','pricing_figure','hedging_table','hedging_figure'}<=set(manifest.artifact_type),'final manifest has all artifact classes'); ck(all(Path(x).exists() for x in manifest.destination.astype(str)),'all final manifest destinations exist'); ck(manifest.destination.astype(str).str.contains('/hedging/wls/').any(),'final package contains WLS hedging artifacts'); ck(manifest.destination.astype(str).str.contains('/hedging/pwls/').any(),'final package contains PWLS hedging artifacts'); report['final']={'rows':len(manifest),'counts':manifest.artifact_type.value_counts().to_dict()}
          (root/'smoke_report.json').write_text(json.dumps(report,indent=2,default=str),encoding='utf-8')
          print('SMOKE_VERIFICATION_SUCCESS')
          print(json.dumps(report,indent=2,default=str))
          PY

      - name: Run full unit test suite after notebook smoke
        if: always()
        run: python -m unittest discover -s tests -v

      - name: Upload smoke report and outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-e2e-smoke-v2
          path: |
            smoke_selected_snapshots.json
            smoke_report.json
            excel files/canonical/*.xlsx
            notebooks/pricing_outputs/canonical/
            notebooks/hedging_outputs/canonical/
            notebooks/final_outputs/canonical/
            notebooks/00_check_data.ipynb
            notebooks/01_run_calibration.ipynb
            notebooks/02_pricing_analysis.ipynb
            notebooks/03_run_hedging.ipynb
            notebooks/04_final_analysis.ipynb
          if-no-files-found: warn
