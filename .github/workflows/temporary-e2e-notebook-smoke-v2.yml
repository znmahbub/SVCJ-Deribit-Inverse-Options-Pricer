name: temporary-e2e-notebook-smoke-v2

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
    paths:
      - .github/workflows/temporary-e2e-notebook-smoke-v2.yml

permissions:
  contents: read

jobs:
  red-price-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Run mini pipeline price-consistency regression
        run: python -m unittest tests.test_mini_pipeline.TestMiniCanonicalPipeline.test_synthetic_snapshot_to_final_artifact_assembly -v
