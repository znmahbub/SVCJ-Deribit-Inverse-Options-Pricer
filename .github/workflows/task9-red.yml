name: task9-red

on:
  push:
    branches: [paper-code-remediation]
    paths:
      - .github/workflows/task9-red.yml

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat openpyxl plotly
      - run: python -m unittest tests.test_regularization_selection -v
