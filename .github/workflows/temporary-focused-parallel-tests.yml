name: temporary-focused-parallel-tests

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run focused execution tests
        run: |
          python -m unittest discover -s tests -p 'test_parallel_checkpoint_execution.py' -v
          python -m unittest discover -s tests -p 'test_batch_regularization_sequence.py' -v
          python -m unittest discover -s tests -p 'test_notebook_progress.py' -v
