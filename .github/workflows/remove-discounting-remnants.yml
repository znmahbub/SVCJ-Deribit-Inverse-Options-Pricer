name: remove-discarded-robustness-remnants

on:
  push:
    branches: [task13-staged-rerun]
    paths:
      - '.github/workflows/remove-discounting-remnants.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task13-staged-rerun
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Remove obsolete robustness language and machinery
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'expected text not found in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/inverse_fft_pricer.py',
              'under the pricing measure ``Q`` for which\n    the futures price is a martingale under the maintained deterministic/zero-\n    discounting setup.  These functions are vectorised',
              'under the pricing measure ``Q`` for which\n    the dated futures price is a martingale. These functions are vectorised',
          )
          replace(
              'src/inverse_fft_pricer.py',
              '"""Analytic Black–76 call price (undiscounted; r=0)."""',
              '"""Analytic Black–76 call price in the futures-price formulation."""',
          )
          replace(
              'src/inverse_fft_pricer.py',
              '"""Analytic Black–76 put price (undiscounted; r=0)."""',
              '"""Analytic Black–76 put price in the futures-price formulation."""',
          )
          p = Path('src/inverse_fft_pricer.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'Assumes r = 0 for pricing on\n    futures/forwards (as in Black-76 / Deribit conventions).',
              'Uses the dated futures/forward price directly as the state variable.',
          )
          text = text.replace(
              'Semi-analytical Heston call price on a futures/forward (USD), with r = 0.',
              'Semi-analytical Heston call price on a futures/forward (USD).',
          )
          text = text.replace(
              'Semi-analytical Heston put price on a futures/forward (USD), with r = 0.',
              'Semi-analytical Heston put price on a futures/forward (USD).',
          )
          p.write_text(text, encoding='utf-8')

          p = Path('docs/code_documentation.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'under the pricing measure `Q` for which the dated futures price is a martingale\nunder the maintained deterministic/zero-discounting setup. `src/greeks.py`',
              'under the pricing measure `Q` for which the dated futures price is a martingale.\n`src/greeks.py`',
          )
          text = re.sub(
              r'### Discounting and identification robustness\n\n.*?\Z',
              '### SVCJ identification diagnostics\n\n'
              '`notebooks/_lib/robustness.py` reports SVCJ Feller-gap frequencies, '
              'Brownian-`rho` boundary clustering, `sigma_y`/jump-intensity near-bound behavior, '
              'martingale/FFT-contour moment margins, descriptive `|rho_j|>1` frequency, and '
              'parameter correlations. `rho_j` has no boundary-hit statistic because it is an '
              'unbounded conditional jump-size loading. `notebooks/robustness_checks.ipynb` '
              'exports these diagnostics for the corrected calibration paths.\n',
              text,
              flags=re.S,
          )
          p.write_text(text, encoding='utf-8')

          p = Path('docs/superpowers/specs/2026-10-13-paper-code-remediation-design.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              '14. Zero discounting should be justified with a quantitative robustness check because the sample contains longer maturities.\n',
              '',
          )
          text = text.replace(
              '- `Q`: the pricing measure used by `cf_black`, `cf_heston`, and `cf_svcj`, under which the dated futures price `F_t` is a martingale under the maintained deterministic/zero-discounting setup.',
              '- `Q`: the pricing measure used by `cf_black`, `cf_heston`, and `cf_svcj`, under which the dated futures price `F_t` is a martingale.',
          )
          text = re.sub(
              r'### 10\. Treat discounting as a robustness gate\n\n.*?(?=### 11\.)',
              '',
              text,
              flags=re.S,
          )
          text = text.replace('### 11. Code first, manuscript second, final rerun last', '### 10. Code first, manuscript second, final rerun last')
          p.write_text(text, encoding='utf-8')

          p = Path('docs/superpowers/plans/2026-10-13-paper-code-remediation.md')
          text = p.read_text(encoding='utf-8')
          text = text.replace('| Zero-discount assumption needs robustness | 12, 13 |\n', '')
          text = text.replace(
              '- `cf_black`, `cf_heston`, `cf_svcj` remain characteristic functions under the measure `Q` for which `F_t` is a martingale under the maintained deterministic/zero-discount setup.',
              '- `cf_black`, `cf_heston`, `cf_svcj` remain characteristic functions under the measure `Q` for which `F_t` is a martingale.',
          )
          task12 = '''### Task 12: Add SVCJ identification diagnostics\n\n**Files:**\n- Create: `notebooks/_lib/robustness.py`\n- Create: `notebooks/robustness_checks.ipynb`\n- Create: `tests/test_robustness_helpers.py`\n\n**Interfaces:**\n- Produces parameter-path diagnostics for Feller gaps, Brownian-`rho` boundary clustering, jump-parameter near-bound behavior, SVCJ moment-domain margins, the empirical distribution of unbounded `rho_j`, and parameter correlations.\n\n- [ ] **Step 1: Write identification-helper tests.** Verify currency-specific summaries, Feller diagnostics, moment margins, and that `rho_j` is treated as an unbounded loading rather than a bounded correlation.\n\n- [ ] **Step 2: Implement identification helpers.** Keep the module diagnostic-only; it must not alter calibration, pricing, or hedging conventions.\n\n- [ ] **Step 3: Add the identification notebook.** Export summary tables and currency-specific parameter-correlation matrices for the corrected calibration paths.\n\n- [ ] **Step 4: Run tests.**\n\n```bash\npython -m unittest tests.test_robustness_helpers -v\n```\n\nExpected: PASS.\n\n- [ ] **Step 5: Commit.**\n\n```bash\ngit add notebooks/_lib/robustness.py notebooks/robustness_checks.ipynb tests/test_robustness_helpers.py\ngit commit -m "feat: add SVCJ identification diagnostics"\n```\n'''
          text, n = re.subn(
              r'### Task 12:.*?(?=\n---\n\n### Task 13:)',
              task12,
              text,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'expected one Task 12 section, replaced {n}')
          text = re.sub(r'^- \[ \] \*\*Step 9: Add the discounting robustness result\.\*\*.*\n?', '', text, flags=re.M)
          text = re.sub(
              r'^6\. \*\*Task 12:\*\*.*$',
              '6. **Task 12:** review SVCJ identification diagnostics before interpreting structural parameter paths.',
              text,
              flags=re.M,
          )
          text = text.replace('- [ ] Discounting + identification robustness', '- [ ] SVCJ identification diagnostics')
          p.write_text(text, encoding='utf-8')
          PY

          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          rm -f .github/workflows/discount-removal-audit.yml
          rm -f .github/workflows/remove-discounting-remnants.yml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbclient jupyter-client
      - name: Run targeted tests
        run: |
          python -m unittest tests.test_robustness_helpers tests.test_notebook_integrity tests.test_notebook_structure tests.test_measure_delta_identities tests.test_sanity_pricing -v
      - name: Verify discarded experiment is absent from tracked text
        shell: bash
        run: |
          git add -A
          if git grep --cached -nEi 'discount(ing|ed| factor)?|zero[- ]discount|zero[- ]rate|nonzero[- ]rate|rate scenarios?' -- ':!*.pdf' ':!*.xlsx' ':!*.png' ':!*.npz'; then
            echo 'Found stale references; refusing commit.'
            exit 1
          fi
      - name: Commit and push cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove discounting robustness"
          git push origin HEAD:task13-staged-rerun
