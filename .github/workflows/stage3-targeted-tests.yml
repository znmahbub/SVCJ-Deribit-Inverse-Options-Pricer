name: stage3-targeted-tests

on:
  push:
    branches: [stage3-hedging-final-runners]
    paths:
      - 'src/hedging_analysis.py'
      - 'src/hedging_analytics.py'
      - 'notebooks/**'
      - 'tests/test_stage3_*.py'
      - '.github/workflows/stage3-targeted-tests.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage3-hedging-final-runners
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Stage 3 targeted tests
        run: >-
          python -m unittest
          tests.test_stage3_hedging_window
          tests.test_stage3_workflow
          tests.test_stage3_notebooks
          -v
