name: task13-stage2a-sweep-low

on:
  push:
    branches: [task13-staged-rerun]
    paths:
      - .github/workflows/task13-stage2a-sweep-low.yml
      - scripts/task13_candidate.py

jobs:
  calibrate:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        reg: [0, 1, 3, 5, 10]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      REG: ${{ matrix.reg }}
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calibration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly threadpoolctl
      - name: Calibrate frozen sample and export validation-only selection evidence
        run: python scripts/task13_candidate.py
      - name: Upload compact candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: candidate-reg-${{ matrix.reg }}
          path: _task13/reg_${{ matrix.reg }}/candidate_export/
          if-no-files-found: error
          retention-days: 7
          compression-level: 9
