name: task13-cancel-duplicates

on:
  push:
    branches: [task13-staged-rerun]
    paths:
      - .github/workflows/task13-cancel-duplicates.yml

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancel superseded duplicate runs
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 38393741469 38394995605 38395102632; do
            status="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${run_id} --jq .status)"
            echo "run ${run_id}: ${status}"
            if [ "$status" != "completed" ]; then
              gh api -X POST repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel
            fi
          done
