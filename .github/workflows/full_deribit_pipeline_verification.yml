name: full-deribit-pipeline-verification

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/richer-deribit-snapshots"
    paths:
      - ".github/workflows/full_deribit_pipeline_verification.yml"

permissions:
  contents: read

jobs:
  full-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Focused regression tests
        run: |
          python -m unittest tests.test_collect_deribit_snapshot.CollectorUnitTests tests.test_deribit_depth_mapping tests.test_backfill_futures_marks -v

      - name: Full live BTC + ETH snapshot
        run: |
          rm -rf integration-data
          mkdir -p integration-data
          python src/collect_deribit_snapshot.py \
            --currency BOTH \
            --sleep 0.02 \
            --order-book-depth 20 \
            --outdir integration-data

      - name: Verify complete downloaded snapshot
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import json
          import pandas as pd

          d = Path('integration-data')
          option_files = list(d.glob('deribit_options_snapshot_*.csv'))
          future_files = list(d.glob('deribit_futures_snapshot_*.csv'))
          book_files = list(d.glob('deribit_order_book_snapshot_*.csv.gz'))
          manifest_files = list(d.glob('deribit_snapshot_manifest_*.json'))
          raw_files = list(d.glob('raw/deribit/*/api_responses.jsonl.gz'))
          assert len(option_files) == len(future_files) == len(book_files) == len(manifest_files) == len(raw_files) == 1

          options = pd.read_csv(option_files[0])
          futures = pd.read_csv(future_files[0])
          books = pd.read_csv(book_files[0])
          manifest = json.loads(manifest_files[0].read_text())

          assert manifest['complete'] is True, manifest['failures']
          assert manifest['status'] == 'complete'
          assert manifest['currencies'] == ['BTC', 'ETH']
          assert manifest['full_option_universe_requested'] is True
          assert manifest['order_book_depth'] == 20
          assert manifest['deribit_order_book_request_depth'] == 20

          expected_options = 0
          expected_futures = 0
          for c in ('BTC', 'ETH'):
              os = manifest['options'][c]
              fs = manifest['futures'][c]
              assert os['selected'] == os['discovered'] == os['collected'] and os['failed'] == 0, os
              assert fs['selected'] == fs['discovered'] == fs['collected'] and fs['failed'] == 0, fs
              assert os['collected'] > 0
              assert fs['collected'] > 0
              expected_options += os['collected']
              expected_futures += fs['collected']

          assert len(options) == expected_options
          assert len(futures) == expected_futures
          assert set(options['currency'].dropna().unique()) == {'BTC', 'ETH'}
          assert set(futures['currency'].dropna().unique()) == {'BTC', 'ETH'}
          assert {'BTC-PERPETUAL', 'ETH-PERPETUAL'}.issubset(set(futures['instrument_name']))
          for col in ['snapshot_id','requested_at_utc','received_at_utc','exchange_timestamp','bid_amount','ask_amount']:
              assert col in options.columns
          for col in ['mark_price','bid_price','ask_price','current_funding','funding_8h']:
              assert col in futures.columns

          assert not books.empty
          assert int(books['level'].min()) >= 1
          assert int(books['level'].max()) <= 20
          assert set(books['instrument_kind'].unique()).issubset({'option','future'})
          assert {'bid','ask'}.issuperset(set(books['side'].unique()))

          raw = []
          with gzip.open(raw_files[0], 'rt', encoding='utf-8') as fh:
              raw = [json.loads(line) for line in fh if line.strip()]
          order_calls = [r for r in raw if r['path'] == '/public/get_order_book']
          instrument_calls_expected = expected_options + expected_futures
          assert len(order_calls) == instrument_calls_expected, (len(order_calls), instrument_calls_expected)
          assert all(int(r['params']['depth']) == 20 for r in order_calls)
          assert sum(r['path'] == '/public/get_instruments' for r in raw) == 4
          assert sum(r['path'] == '/public/get_book_summary_by_currency' for r in raw) == 4

          print('snapshot_id=', manifest['snapshot_id'])
          print('options=', len(options), manifest['options'])
          print('futures=', len(futures), manifest['futures'])
          print('order_book_rows=', len(books), 'max_level=', int(books['level'].max()))
          print('raw_api_records=', len(raw), 'order_book_calls=', len(order_calls))
          print('perpetuals=', futures[futures['instrument_name'].isin(['BTC-PERPETUAL','ETH-PERPETUAL'])][['instrument_name','mark_price','bid_price','ask_price']].to_dict('records'))
          PY

      - name: Run futures history updater on fresh snapshot
        run: |
          python src/backfill_futures_marks.py \
            --data-dir integration-data \
            --outdir integration-data \
            --sleep 0

      - name: Verify perpetual backfill reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          d = Path('integration-data')
          futures = pd.read_csv(next(d.glob('deribit_futures_snapshot_*.csv')))
          perp = pd.read_csv(d / 'perpetual_futures_prices.csv')
          assert (d / 'term_futures_marks.csv').exists()
          assert (d / 'snapshot_currency_combos.csv').exists()

          direct = futures[futures['instrument_name'].isin(['BTC-PERPETUAL','ETH-PERPETUAL'])].copy()
          assert len(direct) == 2
          assert len(perp) == 2, perp
          assert set(perp['coin']) == {'BTC','ETH'}
          assert set(perp['data_source']) == {'deribit_snapshot'}
          assert set(perp['instrument_name']) == {'BTC-PERPETUAL','ETH-PERPETUAL'}

          for _, row in direct.iterrows():
              got = perp.loc[perp['instrument_name'] == row['instrument_name']].iloc[0]
              for legacy, fresh in [
                  ('perp_futures_mark_price','mark_price'),
                  ('perp_futures_best_bid','bid_price'),
                  ('perp_futures_best_ask','ask_price'),
              ]:
                  a = float(got[legacy])
                  b = float(row[fresh])
                  assert abs(a-b) < 1e-12, (row['instrument_name'], legacy, a, b)
              assert got['futures_snapshot_file'].startswith('deribit_futures_snapshot_')

          print('perpetual_history_rows=', perp[['obs_datetime','coin','instrument_name','perp_futures_mark_price','perp_futures_best_bid','perp_futures_best_ask','data_source']].to_dict('records'))
          term = pd.read_csv(d / 'term_futures_marks.csv')
          print('term_futures_history_rows=', len(term))
          PY

      - name: Show generated files
        run: |
          find integration-data -type f -printf '%p %s bytes\n' | sort

      - name: Upload verification data
        uses: actions/upload-artifact@v4
        with:
          name: full-deribit-pipeline-verification
          path: integration-data
          retention-days: 3
