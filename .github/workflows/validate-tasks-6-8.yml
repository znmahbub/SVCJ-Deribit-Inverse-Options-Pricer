name: apply-tasks-6-8

on:
  push:
    branches:
      - paper-code-remediation
    paths:
      - .github/workflows/validate-tasks-6-8.yml

permissions:
  contents: write

jobs:
  apply:
    if: "github.event.head_commit.message == 'chore: apply validated tasks 6-8'"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbclient jupyter plotly ipykernel
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Apply and verify Task 6
        run: |
          python scripts/remediate_task6.py
          python -m unittest tests.test_calibration_objective tests.test_sanity_pricing tests.test_svcj_admissibility tests.test_results_store_io -v
          git add src/calibration.py src/snapshot_job.py src/results_store.py docs/code_documentation.md
          git commit -m "refactor: make calibration objective semantics explicit"
      - name: Apply and verify Task 7
        run: |
          python scripts/remediate_task7.py
          python -m unittest tests.test_batch_regularization_sequence tests.test_results_store_io tests.test_notebook_structure tests.test_notebook_integrity -v
          git add src/batch_runner.py notebooks/calibrate_all_to_excel.ipynb docs/code_documentation.md
          git commit -m "fix: keep temporal regularization sequential"
      - name: Apply and verify Task 8
        run: |
          python scripts/remediate_task8.py
          python -m unittest tests.test_snapshot_splitting tests.test_results_store_io tests.test_hedging_invariants tests.test_batch_regularization_sequence tests.test_notebook_structure tests.test_notebook_integrity -v
      - name: Final verification
        run: |
          python -m unittest \
            tests.test_analysis_window \
            tests.test_batch_regularization_sequence \
            tests.test_calibration_objective \
            tests.test_hedge_mapping \
            tests.test_hedging_invariants \
            tests.test_measure_delta_identities \
            tests.test_notebook_integrity \
            tests.test_notebook_structure \
            tests.test_regression_reference_outputs \
            tests.test_results_store_io \
            tests.test_sanity_pricing \
            tests.test_snapshot_splitting \
            tests.test_svcj_admissibility -v
      - name: Commit Task 8 and clean temporary machinery
        run: |
          git rm scripts/remediate_task6.py scripts/remediate_task7.py scripts/remediate_task8.py
          git rm .github/workflows/validate-tasks-6-8.yml
          git add -A
          git commit -m "feat: add train validation test calibration split"
      - name: Push completed remediation
        run: git push origin HEAD:paper-code-remediation
