name: validate-tasks-6-8

on:
  push:
    branches:
      - paper-code-remediation
    paths:
      - .github/workflows/validate-tasks-6-8.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-code-remediation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbclient jupyter plotly ipykernel
      - name: Task 6 red
        run: |
          ! python -m unittest tests.test_calibration_objective -v
      - name: Apply Task 6
        run: python scripts/remediate_task6.py
      - name: Task 6 green
        run: python -m unittest tests.test_calibration_objective tests.test_sanity_pricing tests.test_svcj_admissibility tests.test_results_store_io -v
      - name: Export Task 6 state
        run: tar -czf task6-files.tar.gz src/calibration.py src/snapshot_job.py src/results_store.py docs/code_documentation.md
      - uses: actions/upload-artifact@v4
        with:
          name: task6-files
          path: task6-files.tar.gz
      - name: Task 7 red
        run: |
          ! python -m unittest tests.test_batch_regularization_sequence -v
      - name: Apply Task 7
        run: python scripts/remediate_task7.py
      - name: Task 7 green
        run: python -m unittest tests.test_batch_regularization_sequence tests.test_results_store_io tests.test_notebook_structure tests.test_notebook_integrity -v
      - name: Export Task 7 state
        run: tar -czf task7-files.tar.gz src/batch_runner.py notebooks/calibrate_all_to_excel.ipynb docs/code_documentation.md
      - uses: actions/upload-artifact@v4
        with:
          name: task7-files
          path: task7-files.tar.gz
      - name: Task 8 red
        run: |
          ! python -m unittest tests.test_snapshot_splitting -v
      - name: Apply Task 8
        run: python scripts/remediate_task8.py
      - name: Task 8 green
        run: python -m unittest tests.test_snapshot_splitting tests.test_results_store_io tests.test_hedging_invariants tests.test_batch_regularization_sequence tests.test_notebook_structure tests.test_notebook_integrity -v
      - name: Final data-independent suite
        run: |
          python -m unittest \
            tests.test_analysis_window \
            tests.test_batch_regularization_sequence \
            tests.test_calibration_objective \
            tests.test_hedge_mapping \
            tests.test_hedging_invariants \
            tests.test_measure_delta_identities \
            tests.test_notebook_integrity \
            tests.test_notebook_structure \
            tests.test_regression_reference_outputs \
            tests.test_results_store_io \
            tests.test_sanity_pricing \
            tests.test_snapshot_splitting \
            tests.test_svcj_admissibility -v
      - name: Export Task 8 state
        run: |
          tar -czf task8-files.tar.gz \
            src/splitting.py \
            src/snapshot_job.py \
            src/results_store.py \
            src/batch_runner.py \
            src/hedging_analysis.py \
            notebooks/_lib/chapter3_analysis.py \
            notebooks/_lib/chapter3_final.py \
            calibration_example.ipynb \
            notebooks/calibrate_all_to_excel.ipynb \
            docs/code_documentation.md
      - uses: actions/upload-artifact@v4
        with:
          name: task8-files
          path: task8-files.tar.gz
