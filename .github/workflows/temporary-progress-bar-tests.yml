name: temporary-progress-bar-tests

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run focused progress tests
        run: python -m unittest tests.test_calibration_progress -v
