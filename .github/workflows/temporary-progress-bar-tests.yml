name: temporary-progress-bar-tests

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run focused progress tests
        run: python -m unittest tests.test_calibration_progress -v
      - name: Remove temporary verification harness from runner
        run: |
          rm -rf .github/workflows
          rm -f .progress_bar_red_trigger
      - name: Run full unit suite
        run: python -m unittest discover -s tests -p "test_*.py" -v
