name: temporary-provenance-repair-retry

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
    paths:
      - .github/workflows/temporary-provenance-repair-retry.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Reuse validated patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/temporary-provenance-repair.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = wf.index(marker) + len(marker)
          end = wf.index("\n          PY", start)
          lines = wf[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/provenance_patch.py').write_text(script, encoding='utf-8')
          PY
          python /tmp/provenance_patch.py
      - name: Verify focused regression
        run: |
          python -m py_compile src/backfill_futures_marks.py
          python -m unittest -v tests.test_perp_price_provenance
      - name: Commit and rebase safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/backfill_futures_marks.py
          git diff --cached --check
          git commit -m "fix: restore canonical perpetual provenance schema"
          git pull --rebase origin stage4-5-final-validation-cleanup
          git push origin HEAD:stage4-5-final-validation-cleanup
