name: temporary-100snapshot-e2e-verification

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Stage 4/5
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel

      - name: Run complete unit suite on clean repository view
        run: |
          rm -f .github/workflows/temporary-100snapshot-e2e-verification.yml
          python -m unittest discover -s tests -v

      - name: Prepare latest 100 consecutive real snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root=Path.cwd(); data=root/'data'
          files=sorted(data.glob('deribit_options_snapshot_*.csv'))
          if len(files)<100: raise RuntimeError(f'need >=100 snapshots, got {len(files)}')
          chosen=files[-100:]; keep={p.name for p in chosen}
          for p in files:
              if p.name not in keep: p.unlink()
          for p in [root/'excel files'/'canonical',root/'notebooks'/'pricing_outputs'/'canonical',root/'notebooks'/'hedging_outputs'/'canonical',root/'notebooks'/'final_outputs'/'canonical']:
              if p.exists(): shutil.rmtree(p)
          payload={'n_snapshots':len(chosen),'first_snapshot':chosen[0].name,'last_snapshot':chosen[-1].name,'selected_snapshots':[p.name for p in chosen]}
          Path('acceptance_selection.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          print(json.dumps({k:v for k,v in payload.items() if k!='selected_snapshots'},indent=2))
          PY

      - name: Execute notebooks 00 to 04 sequentially
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for nb in \
            notebooks/00_check_data.ipynb \
            notebooks/01_run_calibration.ipynb \
            notebooks/02_pricing_analysis.ipynb \
            notebooks/03_run_hedging.ipynb \
            notebooks/04_final_analysis.ipynb
          do
            echo "========== EXECUTING ${nb} =========="
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=20000 "${nb}"
          done

      - name: Verify mathematical, statistical, and economic logic
        run: python .github/temporary_100snapshot_acceptance.py

      - name: Upload compact acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage45-100snapshot-acceptance
          path: |
            acceptance_selection.json
            acceptance_report_100.json
            acceptance_warnings_100.csv
            notebooks/pricing_outputs/canonical/overall_metrics_by_specification.csv
            notebooks/pricing_outputs/canonical/snapshot_win_rates_by_specification.csv
            notebooks/pricing_outputs/canonical/wls/baseline_overall_metrics.csv
            notebooks/pricing_outputs/canonical/wls/snapshot_time_series_metrics.csv
            notebooks/pricing_outputs/canonical/wls/snapshot_model_win_rates.csv
            notebooks/pricing_outputs/canonical/pwls/baseline_overall_metrics.csv
            notebooks/pricing_outputs/canonical/pwls/snapshot_time_series_metrics.csv
            notebooks/pricing_outputs/canonical/pwls/snapshot_model_win_rates.csv
            notebooks/hedging_outputs/canonical/wls/headline_test.csv
            notebooks/hedging_outputs/canonical/wls/sample_construction.csv
            notebooks/hedging_outputs/canonical/pwls/headline_test.csv
            notebooks/hedging_outputs/canonical/pwls/sample_construction.csv
          if-no-files-found: warn
