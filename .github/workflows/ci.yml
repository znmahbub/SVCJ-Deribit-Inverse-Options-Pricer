name: Canonical verification

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Apply pending hedging shim cleanup
        if: ${{ hashFiles('scripts/remove_hedging_validation_shim.py') != '' }}
        run: |
          python scripts/remove_hedging_validation_shim.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove hedging validation sheet shim"
          git push
      - name: Install requirements
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run canonical FFT validation
        run: python -m unittest tests.test_fft_numerical_validation -v
      - name: Run miniature canonical pipeline
        run: python -m unittest tests.test_mini_pipeline -v
      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Check tracked repository hygiene
        run: |
          if git ls-files | grep -E '(__pycache__|\.pyc$|\.ipynb_checkpoints|task13|regularization_selection|calibration_analysis_complete_reg_)'; then
            echo 'stale tracked artifacts found'
            exit 1
          fi
