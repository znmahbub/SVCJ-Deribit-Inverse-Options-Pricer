name: task13-stage1-preflight

on:
  push:
    branches: [paper-code-remediation]
    paths:
      - .github/workflows/task13-stage1-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tqdm nbformat nbclient jupyter-client ipykernel plotly threadpoolctl
      - name: Full unit and regression suite
        run: python -m unittest discover -s tests -v
