name: discount-removal-audit

on:
  push:
    branches: [task13-staged-rerun]
    paths:
      - '.github/workflows/discount-removal-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: task13-staged-rerun
          fetch-depth: 0
      - name: Search tracked text for discounting remnants
        shell: bash
        run: |
          set +e
          git grep -nEi 'discount(ing|ed| factor)?|zero[- ]discount|zero[- ]rate|nonzero[- ]rate|rate scenarios?' -- \
            ':!*.pdf' ':!*.xlsx' ':!*.png' ':!*.npz' > /tmp/discount-remnants.txt
          status=$?
          set -e
          if [ -s /tmp/discount-remnants.txt ]; then
            cat /tmp/discount-remnants.txt
          else
            echo 'No matching tracked-text remnants.'
          fi
          exit 0
      - name: Run identification-only robustness tests
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest tests.test_robustness_helpers tests.test_notebook_integrity tests.test_notebook_structure -v
