name: temporary-finalize-minimal-parallel-patch

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Stage 4/5 with history
        uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore minimal requested source diff
        run: |
          python - <<'PY'
          from __future__ import annotations
          import ast
          import subprocess
          from pathlib import Path

          BATCH_BASE = "9c7cb256fed33c50b8ad3c5dcd489f5a5fe51840"
          STAGE2_BASE = "082f7554f769e0cc72260fa24e4321b840a37ca9"

          def git_show(commit: str, path: str) -> str:
              return subprocess.check_output(["git", "show", f"{commit}:{path}"], text=True)

          def node_source(text: str, name: str) -> str:
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              for node in tree.body:
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name == name:
                      return "".join(lines[node.lineno - 1:node.end_lineno]).rstrip()
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      if any(isinstance(target, ast.Name) and target.id == name for target in targets):
                          return "".join(lines[node.lineno - 1:node.end_lineno]).rstrip()
              raise RuntimeError(f"node not found: {name}")

          def replace_node(text: str, name: str, replacement: str) -> str:
              tree = ast.parse(text)
              lines = text.splitlines(keepends=True)
              for node in tree.body:
                  matched = isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)) and node.name == name
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      matched = matched or any(isinstance(target, ast.Name) and target.id == name for target in targets)
                  if matched:
                      start = sum(len(line) for line in lines[:node.lineno - 1])
                      end = sum(len(line) for line in lines[:node.end_lineno])
                      return text[:start] + replacement.rstrip() + "\n" + text[end:]
              raise RuntimeError(f"replace target not found: {name}")

          batch_path = Path("src/batch_runner.py")
          current_batch = batch_path.read_text(encoding="utf-8")
          batch = git_show(BATCH_BASE, "src/batch_runner.py")
          batch = batch.replace(
              "import contextlib\nimport os\nimport queue\nimport threading\n",
              "import contextlib\nimport multiprocessing as mp\nimport os\nimport queue\nimport threading\nfrom concurrent.futures import ProcessPoolExecutor, as_completed\n",
              1,
          )
          workbook_sheets = node_source(current_batch, "_WORKBOOK_SHEETS")
          batch = batch.replace(
              "WLS_LAMBDA_TS = 0.0\nPWLS_LAMBDA_TS = 1.0\n",
              "WLS_LAMBDA_TS = 0.0\nPWLS_LAMBDA_TS = 1.0\n\n" + workbook_sheets + "\n",
              1,
          )
          helpers = "\n\n\n".join(
              node_source(current_batch, name)
              for name in (
                  "_currency_checkpoint_dir",
                  "_currency_only_workbook",
                  "_checkpoint_is_complete",
                  "flush_currency_checkpoint",
                  "load_currency_checkpoint",
                  "_load_currency_resume_workbook",
                  "_merge_currency_workbooks",
                  "_currency_process_count",
              )
          )
          marker = "# ---------------------------------------------------------------------------\n# Warm start helpers\n# ---------------------------------------------------------------------------"
          batch = batch.replace(marker, helpers + "\n\n\n" + marker, 1)
          batch = replace_node(batch, "run_currency_to_excel", node_source(current_batch, "run_currency_to_excel"))
          batch = replace_node(
              batch,
              "run_all_snapshots_to_excel",
              node_source(current_batch, "_run_currency_checkpoint_worker") + "\n\n\n" + node_source(current_batch, "run_all_snapshots_to_excel"),
          )
          batch = replace_node(batch, "__all__", node_source(current_batch, "__all__"))
          batch_path.write_text(batch, encoding="utf-8")

          stage2_path = Path("notebooks/_lib/stage2_workflow.py")
          current_stage2 = stage2_path.read_text(encoding="utf-8")
          stage2 = git_show(STAGE2_BASE, "notebooks/_lib/stage2_workflow.py")
          stage2 = stage2.replace(
              "import os\nfrom dataclasses import dataclass\n",
              "import os\nfrom concurrent.futures import ThreadPoolExecutor, as_completed\nfrom dataclasses import dataclass\n",
              1,
          )
          stage2 = stage2.replace(
              "def run_calibration_suite(",
              node_source(current_stage2, "_can_run_specifications_concurrently") + "\n\n\ndef run_calibration_suite(",
              1,
          )
          stage2 = replace_node(stage2, "run_calibration_suite", node_source(current_stage2, "run_calibration_suite"))
          stage2_path.write_text(stage2, encoding="utf-8")

          subprocess.run(["git", "diff", "--check"], check=True)
          print(subprocess.check_output(["git", "diff", "--stat"], text=True))
          PY

      - name: Run focused and regression tests
        run: |
          rm -f .github/workflows/temporary-finalize-minimal-parallel-patch.yml
          python -m unittest discover -s tests -p 'test_parallel_checkpoint_execution.py' -v
          python -m unittest discover -s tests -p 'test_batch_regularization_sequence.py' -v
          python -m unittest discover -s tests -p 'test_stage2_workflow.py' -v

      - name: Commit minimal source patch and remove this workflow
        run: |
          rm -f .github/workflows/temporary-finalize-minimal-parallel-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/batch_runner.py notebooks/_lib/stage2_workflow.py
          git add -u .github/workflows/temporary-finalize-minimal-parallel-patch.yml
          git diff --cached --check
          git commit -m "perf: finalize parallel calibration checkpoint execution"
          git push origin HEAD:stage4-5-final-validation-cleanup
