name: verify-10-snapshots-temp

on:
  push:
    branches:
      - stage4-5-final-validation-cleanup

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage4-5-final-validation-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nbconvert nbclient ipykernel
      - name: Concurrency preflight
        run: |
          python - <<'PY'
          import os, sys
          from pathlib import Path
          root = Path.cwd()
          sys.path.insert(0, str(root / 'notebooks'))
          import src.batch_runner as batch
          from _lib import stage2_workflow as stage2
          cfgs = stage2.build_calibration_configs(root, resume=False, verbose=False)
          cpus = os.cpu_count() or 1
          pwls_chains = batch._currency_process_count(cfgs['pwls'], available_cpus=cpus)
          concurrent_specs = stage2._can_run_specifications_concurrently(cfgs, available_cpus=cpus)
          print('cpu_count=', cpus)
          print('wls_workers=', cfgs['wls'].n_workers)
          print('pwls_currency_chains=', pwls_chains)
          print('concurrent_specs=', concurrent_specs)
          assert pwls_chains == 2
          assert concurrent_specs
          PY
      - name: Unit tests
        run: |
          rm -rf .github/workflows
          python -m unittest discover -s tests -v
      - name: Select latest 10 snapshots
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, shutil
          root = Path.cwd()
          files = sorted((root / 'data').glob('deribit_options_snapshot_*.csv'))
          if len(files) < 10:
              raise RuntimeError(f'need at least 10 snapshots, found {len(files)}')
          chosen = files[-10:]
          keep = {p.name for p in chosen}
          for p in files:
              if p.name not in keep:
                  p.unlink()
          for path in (
              root / 'excel files' / 'canonical',
              root / 'notebooks' / 'pricing_outputs' / 'canonical',
              root / 'notebooks' / 'hedging_outputs' / 'canonical',
              root / 'notebooks' / 'final_outputs' / 'canonical',
          ):
              if path.exists():
                  shutil.rmtree(path)
          payload = {
              'n_snapshots': 10,
              'first_snapshot': chosen[0].name,
              'last_snapshot': chosen[-1].name,
              'selected_snapshots': [p.name for p in chosen],
          }
          Path('acceptance_selection_10.json').write_text(json.dumps(payload, indent=2), encoding='utf-8')
          print(json.dumps(payload, indent=2))
          PY
      - name: Execute canonical notebooks
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          for nb in notebooks/00_check_data.ipynb notebooks/01_run_calibration.ipynb notebooks/02_pricing_analysis.ipynb notebooks/03_run_hedging.ipynb notebooks/04_final_analysis.ipynb; do
            echo "EXECUTING ${nb}"
            jupyter nbconvert --to notebook --execute --inplace --ExecutePreprocessor.timeout=20000 "${nb}"
          done
      - name: Acceptance checks
        run: python .github/final_10snapshot_acceptance.py
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage45-10snapshot-final
          path: |
            acceptance_selection_10.json
            acceptance_report_10.json
            acceptance_failed_svcj_wls.csv
            acceptance_failed_svcj_pwls.csv
            notebooks/pricing_outputs/canonical/overall_metrics_by_specification.csv
            notebooks/pricing_outputs/canonical/snapshot_win_rates_by_specification.csv
            notebooks/hedging_outputs/canonical/wls/headline_test.csv
            notebooks/hedging_outputs/canonical/pwls/headline_test.csv
          if-no-files-found: warn
