name: task13-stage3-validation-selection

on:
  push:
    branches: [task13-staged-rerun]
    paths:
      - .github/workflows/task13-stage3-validation-selection.yml

permissions:
  actions: read
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_RUN_ID: '38395028358'
      RUN_LOW: '38392782093'
      RUN_MID: '38394959431'
      RUN_HIGH: '38395028358'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for complete regularization sweep
        shell: bash
        run: |
          while true; do
            status="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID} --jq .status)"
            conclusion="$(gh api repos/${GITHUB_REPOSITORY}/actions/runs/${UPSTREAM_RUN_ID} --jq '.conclusion // ""')"
            echo "upstream status=${status} conclusion=${conclusion}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "High-lambda gate failed; refusing regularization selection."
                exit 1
              fi
              break
            fi
            sleep 30
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install selection dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install plotly nbformat nbclient jupyter-client ipykernel
      - name: Download validation-only candidate evidence
        shell: bash
        run: |
          mkdir -p _task13_selection/candidates
          gh run download "$RUN_LOW" -D _task13_selection/candidates
          gh run download "$RUN_MID" -D _task13_selection/candidates
          gh run download "$RUN_HIGH" -D _task13_selection/candidates
      - name: Reconstruct selection-only workbooks and verify no final-test leakage
        run: python scripts/task13_prepare_selection.py
      - name: Execute validation-only regularization notebook
        run: |
          python - <<'PY'
          from pathlib import Path
          from tests.notebook_utils import execute_notebook_in_memory
          root = Path.cwd().resolve()
          nb = execute_notebook_in_memory(
              root / 'notebooks' / 'regularization_selection.ipynb',
              working_directory=root / 'notebooks',
              timeout=1800,
          )
          print('executed cells:', sum(1 for c in nb.cells if c.cell_type == 'code'))
          PY
      - name: Determine selected lambda from validation evidence only
        id: choice
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          import pandas as pd
          from notebooks._lib.chapter3_final import select_regularisation_candidate
          path = Path('notebooks/chapter3_outputs/remediation/regularization_selection/regularisation_summary_validation.csv')
          summary = pd.read_csv(path)
          forbidden = [c for c in summary.columns if 'test' in c.lower()]
          if forbidden:
              raise SystemExit(f'Final-test leakage in selection summary: {forbidden}')
          selected = select_regularisation_candidate(summary)
          print(f'selected={selected}')
          PY
      - name: Commit validation evidence before locking lambda
        id: evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            notebooks/chapter3_outputs/remediation/regularization_selection/candidate_qc.csv \
            notebooks/chapter3_outputs/remediation/regularization_selection/regularisation_summary_validation.csv
          if [ -f notebooks/chapter3_outputs/remediation/regularization_selection/regularisation_tradeoff_validation.html ]; then
            git add notebooks/chapter3_outputs/remediation/regularization_selection/regularisation_tradeoff_validation.html
          fi
          git commit -m "results: record validation-only regularization selection evidence"
          echo "evidence_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Lock selected lambda before any final-test reporting
        env:
          SELECTED: ${{ steps.choice.outputs.selected }}
          EVIDENCE_SHA: ${{ steps.evidence.outputs.evidence_sha }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('docs/reproducibility/regularization_selection.md')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'^- Status: .*$', '- Status: LOCKED', text, flags=re.MULTILINE)
          text = re.sub(r'^- Selected lambda_TS: .*$', f"- Selected lambda_TS: {os.environ['SELECTED']}", text, flags=re.MULTILINE)
          text = re.sub(r'^- Selection commit: .*$', f"- Selection commit: {os.environ['EVIDENCE_SHA']}", text, flags=re.MULTILINE)
          path.write_text(text, encoding='utf-8')
          PY
          git add docs/reproducibility/regularization_selection.md
          git commit -m "results: lock validation-selected temporal regularization"
          git push origin HEAD:task13-staged-rerun
      - name: Upload selection evidence
        uses: actions/upload-artifact@v4
        with:
          name: task13-validation-selection
          path: |
            docs/reproducibility/regularization_selection.md
            notebooks/chapter3_outputs/remediation/regularization_selection/candidate_qc.csv
            notebooks/chapter3_outputs/remediation/regularization_selection/regularisation_summary_validation.csv
          retention-days: 14
