name: fix-discounting-promotion

on:
  push:
    branches: [paper-code-remediation]
    paths:
      - tests/test_robustness_helpers.py
      - notebooks/_lib/robustness.py
      - notebooks/robustness_checks.ipynb
      - .github/workflows/fix-discounting-promotion.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: RED/green gate
        run: python -m unittest tests.test_robustness_helpers -v
